<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>358-maktab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* G'oya: kunduzi katak daftar, tunda sinf doskasi.
     Rasmlar skotch bilan yopishtirilgan, sarlavhalar qo'lda yozilgan, eslatmalar yopishqoq qog'ozda. */
  :root {
    --bg: #fdfeff;            /* daftar qog'ozi */
    --rule: #d6e4f3;          /* kataklar */
    --margin: #e2504c;        /* daftar hoshiyasi */
    --ink: #0c142b;           /* to'q siyoh */
    --muted: #38425c;
    --pen: #1438a6;           /* ko'k ruchka */
    --on-pen: #ffffff;
    --red: #cf2e27;           /* o'qituvchining qizil ruchkasi */
    --hl: #ffe45c;            /* marker */
    --card: #ffffff;
    --line: #c3d2e4;
    --note1: #fff3a6; --note2: #d3ebff; --note3: #ffd9e0; --note4: #d9f5d6;
    --note-ink: #141b2e;
    --tape: rgba(255, 221, 87, .78);
    --lit: #ffd84a;           /* yoniq deraza */
    --wall: #eef3fa;
    --grass: #7fcf8a;
    --shade: rgba(12, 20, 43, .14);
    --hand: "Caveat", "Segoe Script", "Comic Sans MS", cursive;
    --font: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13231c; --rule: rgba(255, 255, 255, .055); --margin: #ff8f85; --ink: #f6f5ea; --muted: #c2cfc4;
      --pen: #8ad4ff; --on-pen: #0d1f18; --red: #ff9c93; --hl: rgba(255, 224, 102, .30);
      --card: #1b3027; --line: #3a584a;
      --note1: #3a3a1c; --note2: #1c3443; --note3: #40262f; --note4: #1f3d2a; --note-ink: #f6f5ea;
      --tape: rgba(255, 224, 102, .40); --lit: #ffe066; --wall: #223a2f; --grass: #3f8f55;
      --shade: rgba(0, 0, 0, .40); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13231c; --rule: rgba(255, 255, 255, .055); --margin: #ff8f85; --ink: #f6f5ea; --muted: #c2cfc4;
    --pen: #8ad4ff; --on-pen: #0d1f18; --red: #ff9c93; --hl: rgba(255, 224, 102, .30);
    --card: #1b3027; --line: #3a584a;
    --note1: #3a3a1c; --note2: #1c3443; --note3: #40262f; --note4: #1f3d2a; --note-ink: #f6f5ea;
    --tape: rgba(255, 224, 102, .40); --lit: #ffe066; --wall: #223a2f; --grass: #3f8f55;
    --shade: rgba(0, 0, 0, .40); color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body {
    margin: 0; color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.6;
    background-color: var(--bg);
    background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 26px 26px;
    transition: background-color .35s, color .35s;
  }
  /* daftarning qizil hoshiya chizig'i */
  body::before { content: ""; position: fixed; top: 0; bottom: 0; left: max(8px, calc(50% - 590px)); width: 2px; background: var(--margin); opacity: .55; pointer-events: none; z-index: 0; }
  a { color: var(--pen); }
  button { font-family: inherit; color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 22px; position: relative; }
  section { padding: 56px 0; position: relative; }

  h2 { font-family: var(--hand); font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.2rem); line-height: 1.05; margin: 0 0 26px; text-wrap: balance; }
  h2 span { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); padding: 0 6px; margin: 0 -6px; }
  h3 { font-size: 1.05rem; margin: 0 0 12px; }
  .hand { font-family: var(--hand); font-weight: 600; font-size: 1.35rem; line-height: 1.2; }
  .note { color: var(--muted); font-size: 15px; margin: -10px 0 22px; max-width: 62ch; }
  .tag { display: inline-block; background: var(--hl); color: var(--ink); font: 600 12px var(--font); border-radius: 3px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }
  .paper { background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 3px 4px 0 var(--shade); }

  /* Tepadagi qator */
  .util .wrap { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
  .stamp { margin-right: auto; font-family: var(--hand); font-weight: 700; font-size: 1.15rem; color: var(--red); border: 2px solid var(--red); border-radius: 6px; padding: 0 10px; transform: rotate(-3deg); }
  .langs { display: flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--card); }
  .langs button { font-weight: 600; font-size: 13px; padding: 5px 11px; border: 0; background: transparent; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .theme { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 600; padding: 5px 12px 5px 9px; }
  .theme svg { width: 16px; height: 16px; display: block; }
  .theme .moon { display: none; }
  :root[data-mode="dark"] .theme .sun { display: none; }
  :root[data-mode="dark"] .theme .moon { display: block; }

  /* Bosh qism */
  .hero .wrap { display: grid; grid-template-columns: 1.05fr 1fr; gap: 28px 52px; align-items: center; padding-top: 26px; padding-bottom: 40px; }
  .hero .wrap > * { min-width: 0; }
  .hero .place { font-family: var(--hand); font-weight: 600; font-size: 1.5rem; color: var(--pen); margin: 0 0 4px; }
  .hero h1 { font-weight: 800; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; letter-spacing: -.025em; margin: 0 0 16px; text-wrap: balance; }
  .hero h1 em { font-style: normal; font-family: var(--hand); font-weight: 700; font-size: 1.5em; color: var(--red); letter-spacing: 0; display: inline-block; transform: rotate(-4deg); margin-right: .12em; line-height: .8; }
  .hero .lead { margin: 0 0 22px; max-width: 46ch; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-block; font-weight: 700; text-decoration: none; padding: 11px 20px; border-radius: 8px; border: 2px solid var(--ink); color: var(--ink); background: var(--card); box-shadow: 3px 3px 0 var(--ink); transition: transform .15s, box-shadow .15s; }
  .btn.fill { background: var(--pen); color: var(--on-pen); }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  /* Skotch bilan yopishtirilgan rasm */
  .snap { margin: 0; position: relative; background: var(--card); padding: 10px 10px 8px; border: 1px solid var(--line); box-shadow: 4px 6px 0 var(--shade); }
  .snap::before { content: ""; position: absolute; top: -13px; left: 50%; width: 110px; height: 26px; margin-left: -55px; background: var(--tape); transform: rotate(-3deg); z-index: 2; }
  .snap .frame { overflow: hidden; background: var(--wall); max-width: 100%; position: relative; }
  .snap img { display: block; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .snap figcaption { font-family: var(--hand); font-weight: 600; font-size: 1.2rem; line-height: 1.2; padding-top: 6px; }
  .hero .snap { transform: rotate(2deg); }
  .hero .snap .frame { aspect-ratio: 3 / 2; }

  /* Hozir maktabda */
  .now { margin-top: 26px; display: flex; gap: 18px; align-items: center; padding: 14px 18px; max-width: 470px; }
  .ring { flex: none; width: 74px; height: 74px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring .track { fill: none; stroke: var(--line); stroke-width: 7; }
  .ring .prog { fill: none; stroke: var(--red); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--hand); font-weight: 700; font-size: 1.9rem; }
  .now div { min-width: 0; }
  .now .lbl { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }
  .now .what { font-weight: 800; font-size: 1.15rem; margin: 0; line-height: 1.25; }
  .now .left { margin: 0; font-size: 15px; font-variant-numeric: tabular-nums; }
  .now .left b { color: var(--red); }

  /* Yopishib turadigan bo'limlar ro'yxati */
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  .tabs nav { display: flex; gap: 2px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .tabs a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; padding: 11px 13px; transition: background-color .2s; }
  .tabs a:hover, .tabs a.on { background: var(--hl); }

  /* Maktab haqida */
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
  .about > * { min-width: 0; }
  .about p { margin: 0 0 22px; max-width: 58ch; }
  .stickies { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 0; }
  .stickies div { color: var(--note-ink); padding: 14px 16px 16px; box-shadow: 3px 4px 0 var(--shade); min-width: 0; }
  .stickies div:nth-child(1) { background: var(--note1); transform: rotate(-2deg); }
  .stickies div:nth-child(2) { background: var(--note2); transform: rotate(1.5deg); }
  .stickies div:nth-child(3) { background: var(--note3); transform: rotate(1deg); }
  .stickies div:nth-child(4) { background: var(--note4); transform: rotate(-1.5deg); }
  .stickies dt { font-size: 14px; font-weight: 600; opacity: .8; }
  .stickies dd { margin: 0; font-family: var(--hand); font-weight: 700; font-size: 2rem; line-height: 1.1; }
  .collage { position: relative; padding: 6px 0 90px; }
  .collage .a { width: 84%; transform: rotate(-2deg); }
  .collage .a .frame, .collage .b .frame { aspect-ratio: 3 / 2; }
  .collage .b { position: absolute; right: 0; bottom: 0; width: 54%; transform: rotate(3deg); }
  .credit { font-size: 13px; color: var(--muted); margin: 16px 0 0; }

  /* Bino sxemasi */
  .tour { display: grid; grid-template-columns: 1.25fr 1fr; gap: 36px; align-items: center; }
  .tour > * { min-width: 0; }
  .bld { display: grid; grid-template-columns: 3fr 1.1fr; gap: 0 10px; align-items: end; }
  .bld > *, .bld .floors > * { min-width: 0; }
  .bld .roof { grid-column: 1; height: 16px; background: var(--red); border-radius: 6px 6px 0 0; margin: 0 -8px; }
  .bld .floors { grid-column: 1; grid-row: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--wall); border: 2px solid var(--ink); padding: 10px; }
  .bld .wing { grid-column: 2; grid-row: 2; }
  .bld .ground { grid-column: 1 / -1; height: 8px; background: var(--ink); border-radius: 0 0 4px 4px; }
  .bld .pitch { grid-column: 1 / -1; margin-top: 14px; }
  .room {
    cursor: pointer; text-align: center; font-weight: 600; font-size: 14px; line-height: 1.2;
    min-height: 62px; padding: 8px 6px; border: 2px solid var(--ink); border-radius: 4px;
    background: var(--card); transition: background-color .25s, transform .15s; width: 100%;
  }
  .room:hover { transform: translateY(-2px); }
  .room[aria-pressed="true"] { background: var(--lit); color: #1b1b12; box-shadow: 0 0 22px var(--lit); }
  .door { border: 2px solid var(--ink); border-bottom: 0; border-radius: 30px 30px 0 0; background: var(--pen); min-height: 62px; }
  .wing .room { min-height: 96px; border-radius: 4px 14px 0 0; }
  .pitch .room { background: var(--grass); color: #10231a; min-height: 48px; border-radius: 30px; }
  .pitch .room[aria-pressed="true"] { background: var(--lit); }
  .roominfo { padding: 22px 24px; min-height: 180px; }
  .roominfo h3 { font-family: var(--hand); font-weight: 700; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
  .roominfo p { margin: 0; }
  .fine { font-size: 13px; color: var(--muted); margin: 14px 0 0; }

  /* Direktor */
  .director { display: grid; grid-template-columns: 200px 1fr; gap: 32px; align-items: start; padding: 26px; position: relative; }
  .director > * { min-width: 0; }
  .director::before { content: ""; position: absolute; top: -14px; left: 40px; width: 18px; height: 46px; border: 3px solid var(--muted); border-radius: 10px; border-bottom-color: transparent; }
  .portrait { aspect-ratio: 4 / 5; overflow: hidden; background: var(--note2); color: var(--note-ink); display: grid; place-items: center; font-family: var(--hand); font-weight: 700; font-size: 4rem; max-width: 100%; border: 1px solid var(--line); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .director .role { color: var(--pen); font-weight: 700; margin: 0 0 2px; }
  .director .name { font-weight: 800; font-size: 1.45rem; margin: 0 0 12px; }
  .director .bio { margin: 0 0 18px; max-width: 60ch; }
  .dfacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 28px; margin: 0; }
  .dfacts dt { font-size: 14px; color: var(--muted); }
  .dfacts dd { margin: 0; font-weight: 700; }
  .todo .name, .todo .bio { color: var(--muted); }
  .todo .bio { font-style: italic; }

  /* Sinflar: har bir nuqta bitta o'quvchi */
  .sample { border: 2px dashed var(--red); border-radius: 8px; padding: 12px 16px; margin: 0 0 26px; font-size: 15px; max-width: 72ch; background: var(--card); }
  .totals { display: flex; flex-wrap: wrap; gap: 14px 40px; margin: 0 0 18px; }
  .totals dt { color: var(--muted); font-size: 15px; font-weight: 600; }
  .totals dd { margin: 0; font-family: var(--hand); font-weight: 700; font-size: clamp(2.6rem, 8vw, 3.8rem); color: var(--pen); line-height: .95; font-variant-numeric: tabular-nums; }
  .hint { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
  .stage { font-family: var(--hand); font-weight: 700; font-size: 1.6rem; color: var(--red); margin: 26px 0 4px; }
  .grade { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px 18px; align-items: start; padding: 14px 0; border-top: 2px solid var(--line); }
  .grade > * { min-width: 0; }
  .grade .g { font-weight: 800; font-size: 1.1rem; padding-top: 6px; }
  .rooms { display: flex; flex-wrap: wrap; gap: 10px; }
  .cls { cursor: pointer; text-align: left; width: 112px; padding: 8px 10px 10px; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; transition: transform .15s, box-shadow .15s, background-color .2s; box-shadow: 3px 3px 0 var(--shade); }
  .cls:hover { transform: translate(-1px, -2px); box-shadow: 5px 6px 0 var(--shade); }
  .cls[aria-expanded="true"] { background: var(--note1); color: var(--note-ink); }
  .cls b { font-size: 15px; }
  .cls small { float: right; font-size: 13px; font-weight: 600; opacity: .8; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 7px; clear: both; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--pen); }
  .cls[aria-expanded="true"] .dots i { background: var(--red); }
  .grade .sum { font-size: 15px; color: var(--muted); text-align: right; padding-top: 8px; font-variant-numeric: tabular-nums; }
  .detail { background: var(--note1); color: var(--note-ink); padding: 18px 20px; margin: 0 0 16px; box-shadow: 3px 4px 0 var(--shade); }
  .detail .head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .detail h4 { margin: 0 auto 0 0; font-family: var(--hand); font-weight: 700; font-size: 1.9rem; line-height: 1; }
  .detail .x { border: 2px solid currentColor; background: transparent; border-radius: 6px; padding: 3px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .detail dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 24px; margin: 0 0 12px; }
  .detail dt { font-size: 14px; opacity: .8; }
  .detail dd { margin: 0; font-weight: 700; }
  .detail dd.soon { font-weight: 400; font-style: italic; opacity: .8; }
  .detail p { margin: 0; font-size: 14px; opacity: .85; max-width: 70ch; }

  /* O'qituvchilar va to'garaklar */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; list-style: none; margin: 0; padding: 0; }
  .tcard { padding: 16px; display: flex; gap: 14px; align-items: center; min-width: 0; }
  .tcard:nth-child(odd) { transform: rotate(-.8deg); }
  .tcard:nth-child(even) { transform: rotate(.8deg); }
  .avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: var(--note2); color: var(--note-ink); display: grid; place-items: center; font-family: var(--hand); font-weight: 700; font-size: 1.5rem; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tcard div { min-width: 0; }
  .tcard strong { display: block; line-height: 1.3; }
  .tcard .sub { color: var(--pen); font-size: 15px; font-weight: 600; }
  .tcard .exp { color: var(--muted); font-size: 14px; display: block; }
  .tcard.todo, .club.todo { border-style: dashed; }
  .tcard.todo strong, .club.todo strong { color: var(--muted); }
  .club { color: var(--note-ink); padding: 16px 18px; box-shadow: 3px 4px 0 var(--shade); }
  .club:nth-child(3n+1) { background: var(--note4); transform: rotate(-1deg); }
  .club:nth-child(3n+2) { background: var(--note2); transform: rotate(1deg); }
  .club:nth-child(3n) { background: var(--note3); transform: rotate(-.5deg); }
  .club strong { display: block; font-family: var(--hand); font-weight: 700; font-size: 1.6rem; line-height: 1.1; }
  .club span { font-size: 15px; }

  /* Nazorat ishi */
  .quiz { max-width: 720px; padding: 26px 28px 28px; position: relative; }
  .quiz .qno { font-family: var(--hand); font-weight: 700; font-size: 1.4rem; color: var(--pen); margin: 0 0 4px; }
  .quiz .q { font-weight: 800; font-size: 1.25rem; margin: 0 0 16px; line-height: 1.3; }
  .answers { display: grid; gap: 10px; margin-bottom: 16px; }
  .ans { cursor: pointer; text-align: left; font-size: 16px; font-weight: 600; padding: 11px 14px; background: var(--card); border: 2px solid var(--ink); border-radius: 8px; transition: transform .15s; }
  .ans:not(:disabled):hover { transform: translateX(4px); }
  .ans:disabled { cursor: default; opacity: .65; }
  .ans.right { background: var(--note4); color: var(--note-ink); opacity: 1; border-color: currentColor; }
  .ans.wrong { background: var(--note3); color: var(--note-ink); opacity: 1; text-decoration: line-through; }
  .quiz .say { min-height: 1.6em; margin: 0 0 14px; font-weight: 600; }
  .mark { position: absolute; right: 26px; top: 18px; width: 92px; height: 92px; border: 4px solid var(--red); border-radius: 50%; display: grid; place-items: center; font-family: var(--hand); font-weight: 700; font-size: 4rem; color: var(--red); transform: rotate(-12deg); }
  .quiz .result { font-family: var(--hand); font-weight: 700; font-size: 2.2rem; line-height: 1.1; margin: 0 110px 8px 0; }

  /* Yangiliklar */
  .news { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
  .news li { display: grid; grid-template-columns: 120px 1fr; gap: 6px 24px; padding: 20px 22px; }
  .news li > * { min-width: 0; }
  .news .when { font-family: var(--hand); font-weight: 700; font-size: 1.5rem; color: var(--red); line-height: 1.2; }
  .news h3 { margin-bottom: 6px; font-size: 1.15rem; }
  .news p { margin: 0; max-width: 64ch; }
  .news .src { font-size: 14px; display: inline-block; margin-top: 6px; }
  .news li.todo { border-style: dashed; }
  .news li.todo h3, .news li.todo p { color: var(--muted); font-style: italic; }

  /* Manzil */
  .where { display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; align-items: start; }
  .where > * { min-width: 0; }
  .where .snap .frame { aspect-ratio: 3 / 2; }
  .pin { position: absolute; left: 74%; top: 66%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--red); border: 3px solid #fff; z-index: 1; }
  .pin::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--red); }
  .where dl { margin: 0 0 20px; display: grid; gap: 12px; }
  .where dt { font-size: 14px; color: var(--muted); font-weight: 600; }
  .where dd { margin: 0; font-weight: 700; }
  .where dd.soon { font-weight: 400; font-style: italic; color: var(--muted); }
  .mapbox { margin-top: 22px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .mapbox iframe { display: block; width: 100%; height: 320px; border: 0; }

  footer { border-top: 2px solid var(--ink); padding: 26px 0 34px; background: var(--bg); position: relative; }
  footer p { margin: 0 0 6px; font-size: 15px; }

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function fill(id, items, build) {
  const box = document.getElementById(id);
  box.textContent = "";
  items.forEach(function (item, i) { const n = build(item, i); if (n) box.appendChild(n); });
  return box;
}
function tag() { return el("span", "tag", T[LANG].todo); }
function initials(name) {
  return name.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
}
function photoInto(box, src, alt) {
  if (!src) return;
  const img = new Image();
  img.alt = alt;
  img.onload = function () { box.textContent = ""; box.appendChild(img); };
  img.src = src;
}
function pair(dl, label, value, soon) {
  const row = el("div");
  row.appendChild(el("dt", "", label));
  row.appendChild(el("dd", soon ? "soon" : "", value));
  dl.appendChild(row);
}

/* ---------- Hozir maktabda ---------- */
function mins(hhmm) { const p = hhmm.split(":"); return Number(p[0]) * 60 + Number(p[1]); }
function tashkentNow() {
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tashkent", weekday: "short", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(new Date());
  const o = {};
  parts.forEach(function (p) { o[p.type] = p.value; });
  const days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  return { day: days[o.weekday], sec: (Number(o.hour) % 24) * 3600 + Number(o.minute) * 60 + Number(o.second) };
}
function clock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const mm = (h ? String(m).padStart(2, "0") : String(m)), ss = String(s).padStart(2, "0");
  return (h ? h + ":" : "") + mm + ":" + ss;
}
function tickNow() {
  const L = T[LANG];
  const now = tashkentNow();
  const C = 213.6;
  let num = "", what = "", left = null, frac = 0;
  if (SCHOOL_DAYS.indexOf(now.day) === -1) { num = "☼"; what = L.dayoff; left = [L.rest, ""]; }
  else {
    const first = mins(BELLS[0][0]) * 60, last = mins(BELLS[BELLS.length - 1][1]) * 60;
    if (now.sec < first) { num = "1"; what = L.before; left = L.toStart(clock(first - now.sec)); }
    else if (now.sec >= last) { num = "✓"; what = L.after; left = [L.seeYou, ""]; frac = 1; }
    else {
      for (let i = 0; i < BELLS.length; i++) {
        const a = mins(BELLS[i][0]) * 60, b = mins(BELLS[i][1]) * 60;
        if (now.sec >= a && now.sec < b) { num = String(i + 1); what = L.lesson(i + 1); left = L.toBell(clock(b - now.sec)); frac = (now.sec - a) / (b - a); break; }
        const nx = BELLS[i + 1] ? mins(BELLS[i + 1][0]) * 60 : null;
        if (nx !== null && now.sec >= b && now.sec < nx) { num = "♪"; what = L.brk; left = L.toLesson(i + 2, clock(nx - now.sec)); frac = (now.sec - b) / (nx - b); break; }
      }
    }
  }
  document.getElementById("nowNum").textContent = num;
  document.getElementById("nowWhat").textContent = what;
  const lf = document.getElementById("nowLeft");
  lf.textContent = left ? left[0] : "";
  if (left && left[1]) lf.appendChild(el("b", "", left[1]));
  document.getElementById("nowRing").setAttribute("stroke-dashoffset", String(C * (1 - frac)));
  document.getElementById("bellTag").hidden = !BELLS_SAMPLE;
}

/* ---------- Bino sxemasi ---------- */
function renderTour() {
  const L = T[LANG];
  const boxes = { f: document.getElementById("floors"), w: document.getElementById("wing"), p: document.getElementById("pitch") };
  Object.keys(boxes).forEach(function (k) { boxes[k].textContent = ""; });
  ROOMS.forEach(function (r, i) {
    if (r.door) { boxes[r.where].appendChild(el("div", "door")); return; }
    const b = el("button", "room", r.name[LANG]);
    b.type = "button";
    b.setAttribute("aria-pressed", String(ROOM === i));
    b.addEventListener("click", function () { ROOM = i; renderTour(); });
    boxes[r.where].appendChild(b);
  });
  const info = document.getElementById("roomInfo");
  info.textContent = "";
  if (ROOM === null) { info.appendChild(el("h3", "", L.tourEmpty)); info.appendChild(el("p", "", L.tourEmptyText)); }
  else { info.appendChild(el("h3", "", ROOMS[ROOM].name[LANG])); info.appendChild(el("p", "", ROOMS[ROOM].text[LANG])); }
}

function totals() {
  let students = 0, classes = 0;
  CLASSES.forEach(function (c) { Object.keys(c.groups).forEach(function (k) { students += c.groups[k]; classes += 1; }); });
  return { students: students, classes: classes, avg: classes ? Math.round(students / classes) : 0 };
}
function detailBox(id, count) {
  const L = T[LANG];
  const info = CLASS_INFO[id] || {};
  const box = el("div", "detail");
  box.setAttribute("role", "region");
  const head = el("div", "head");
  head.appendChild(el("h4", "", L.detailTitle(id)));
  const x = el("button", "x", L.close);
  x.type = "button";
  x.addEventListener("click", function () { OPEN = null; renderGrades(); });
  head.appendChild(x);
  box.appendChild(head);
  const dl = el("dl");
  pair(dl, L.dCount, String(count));
  if (info.boys !== undefined) pair(dl, L.dBoys, String(info.boys));
  if (info.girls !== undefined) pair(dl, L.dGirls, String(info.girls));
  pair(dl, L.dTeacher, info.teacher || L.soon, !info.teacher);
  pair(dl, L.dRoom, info.room || L.soon, !info.room);
  pair(dl, L.dShift, info.shift ? L.shiftName(info.shift) : L.soon, !info.shift);
  box.appendChild(dl);
  box.appendChild(el("p", "", L.privacy));
  return box;
}
function renderGrades() {
  const L = T[LANG];
  const grades = document.getElementById("grades");
  grades.textContent = "";
  STAGES.forEach(function (stage) {
    const rows = CLASSES.filter(function (c) { return c.grade >= stage.from && c.grade <= stage.to; });
    if (!rows.length) return;
    grades.appendChild(el("h3", "stage", stage.name[LANG]));
    rows.forEach(function (c) {
      const row = el("div", "grade");
      row.appendChild(el("div", "g", L.gradeName(c.grade)));
      const rooms = el("div", "rooms");
      let sum = 0, opened = null;
      const keys = Object.keys(c.groups);
      keys.forEach(function (k) {
        const count = c.groups[k];
        const id = c.grade + "-" + k;
        sum += count;
        const b = el("button", "cls");
        b.type = "button";
        b.setAttribute("aria-expanded", String(OPEN === id));
        b.appendChild(el("b", "", id));
        b.appendChild(el("small", "", String(count)));
        const dots = el("span", "dots");
        dots.setAttribute("aria-hidden", "true");
        for (let d = 0; d < count; d++) { const dot = el("i"); dot.style.setProperty("--k", d); dots.appendChild(dot); }
        b.appendChild(dots);
        b.addEventListener("click", function () { OPEN = OPEN === id ? null : id; renderGrades(); });
        rooms.appendChild(b);
        if (OPEN === id) opened = detailBox(id, count);
      });
      row.appendChild(rooms);
      row.appendChild(el("div", "sum", L.gradeSum(keys.length, sum)));
      grades.appendChild(row);
      if (opened) grades.appendChild(opened);
    });
  });
}

/* ---------- Nazorat ishi ---------- */
function shuffle(n) {
  const a = []; for (let i = 0; i < n; i++) a.push(i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function startQuiz() { QZ.i = 0; QZ.score = 0; QZ.picked = null; QZ.done = false; QZ.order = QUIZ.map(function (q) { return shuffle(q.a.length); }); }
function renderQuiz() {
  const L = T[LANG];
  const box = document.getElementById("quizBox");
  box.textContent = "";
  if (QZ.done) {
    const mark = QZ.score === QUIZ.length ? 5 : QZ.score === QUIZ.length - 1 ? 4 : QZ.score >= Math.ceil(QUIZ.length / 2) ? 3 : 2;
    box.appendChild(el("div", "mark", String(mark)));
    box.appendChild(el("p", "result", L.grades[mark]));
    box.appendChild(el("p", "say", L.resultText(QZ.score, QUIZ.length)));
    const again = el("button", "btn fill", L.again);
    again.type = "button";
    again.addEventListener("click", function () { startQuiz(); renderQuiz(); });
    box.appendChild(again);
    return;
  }
  const q = QUIZ[QZ.i];
  box.appendChild(el("p", "qno", L.qNo(QZ.i + 1, QUIZ.length)));
  box.appendChild(el("p", "q", q.q[LANG]));
  const list = el("div", "answers");
  QZ.order[QZ.i].forEach(function (idx) {
    const b = el("button", "ans", q.a[idx][LANG]);
    b.type = "button";
    if (QZ.picked !== null) {
      b.disabled = true;
      if (idx === 0) b.classList.add("right");
      else if (idx === QZ.picked) b.classList.add("wrong");
    }
    b.addEventListener("click", function () { QZ.picked = idx; if (idx === 0) QZ.score += 1; renderQuiz(); });
    list.appendChild(b);
  });
  box.appendChild(list);
  const say = el("p", "say", QZ.picked === null ? "" : QZ.picked === 0 ? L.yes : L.no(q.a[0][LANG]));
  say.setAttribute("aria-live", "polite");
  box.appendChild(say);
  if (QZ.picked !== null) {
    const last = QZ.i === QUIZ.length - 1;
    const next = el("button", "btn fill", last ? L.finish : L.next);
    next.type = "button";
    next.addEventListener("click", function () { if (last) QZ.done = true; else { QZ.i += 1; QZ.picked = null; } renderQuiz(); });
    box.appendChild(next);
  }
}

  fill("clubList", CLUBS, function (c) {

    if (c.todo) name.appendChild(tag());

  renderQuiz();
  fill("newsList", NEWS, function (item) {
    const li = el("li", "paper" + (item.todo ? " todo" : ""));
    li.appendChild(el("div", "when", item.when[lang]));
    const body = el("div");
    const h = el("h3", "", item.title[lang]);
    if (item.todo) h.appendChild(tag());
    body.appendChild(h);
    body.appendChild(el("p", "", item.text[lang]));
    if (item.src) {
      const a = el("a", "src", L.source + ": " + new URL(item.src).hostname);
      a.href = item.src; a.target = "_blank"; a.rel = "noopener";

    }
    li.appendChild(body);

/* Daftar (kunduzgi) va doska (tungi) rejimi */
(function () {
  const root = document.documentElement;
  const sys = window.matchMedia("(prefers-color-scheme: dark)");
  function current() { return root.dataset.theme || (sys.matches ? "dark" : "light"); }
  function sync() { root.dataset.mode = current(); setThemeLabel(); }
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved === "dark" || saved === "light") root.dataset.theme = saved;
  root.dataset.mode = current();
  document.getElementById("themeBtn").addEventListener("click", function () {
    const next = current() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    sync();
  });
  sys.addEventListener("change", sync);
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
})();

function countUp(scope) {
  if (CALM) return;
  scope.querySelectorAll("[data-count]").forEach(function (node) {
    const to = Number(node.dataset.count);
    const start = performance.now();
    function step(now) {
      const p = Math.min(1, (now - start) / 1100);
      node.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function setupReveal() {
  if (CALM || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.remove("rv-wait");
      countUp(e.target);
      io.unobserve(e.target);
    });
  }, { rootMargin: "0px 0px -10% 0px" });
  document.querySelectorAll(".rv").forEach(function (node) {
    if (node.getBoundingClientRect().top > window.innerHeight * 0.9) { node.classList.add("rv-wait"); io.observe(node); }
  });
}
/* Pastga aylantirilganda rasmlar siljiydi va kattalashadi */
function setupScrollPhotos() {
  if (CALM) return;
  const imgs = Array.prototype.slice.call(document.querySelectorAll("[data-par]"));
  const floats = Array.prototype.slice.call(document.querySelectorAll("[data-float]"));
  floats.forEach(function (f) { f.dataset.rot = getComputedStyle(f).transform; });
  let queued = false;
  function place() {
    queued = false;
    const vh = window.innerHeight;
    imgs.forEach(function (img) {
      const r = img.parentElement.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) return;
      const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / vh));
      img.style.transform = "translate3d(0," + (p * -24).toFixed(1) + "px,0) scale(" + (1.16 - p * 0.08).toFixed(3) + ")";
    });
    floats.forEach(function (fig) {
      const r = fig.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) return;
      const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / vh));
      const base = fig.dataset.rot && fig.dataset.rot !== "none" ? fig.dataset.rot + " " : "";
      fig.style.transform = "translateY(" + (p * 26 * Number(fig.dataset.float)).toFixed(1) + "px) " + base;
    });
  }
  function ask() { if (!queued) { queued = true; requestAnimationFrame(place); } }
  window.addEventListener("scroll", ask, { passive: true });
  window.addEventListener("resize", ask);
  place();
}
function setupTabs() {
  if (!("IntersectionObserver" in window)) return;
  const links = {};
  document.querySelectorAll(".tabs a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      Object.keys(links).forEach(function (k) { links[k].classList.toggle("on", k === e.target.id); });
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  Object.keys(links).forEach(function (k) { const s = document.getElementById(k); if (s) io.observe(s); });
}

setupScrollPhotos();

  });
});
