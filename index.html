<style>
  :root {
    --canal: #0d5566;      /* Bektemir kanali rangi */
    --canal-deep: #083b47;
    --water: #d3ecea;
    --paper: #f6faf9;
    --ink: #12262b;
    --muted: #55707a;
    --sun: #f2b705;        /* maktab qo'ng'irog'i sarig'i */
    --line: #cfdedc;
    --card: #ffffff;
    --on-canal: #ffffff;
    --on-sun: #12262b;
    --footer-bg: #083b47;
    --footer-fg: #e4f1ef;
    --display: "Unbounded", "Golos Text", system-ui, sans-serif;
    --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    --canal: #6cc4d1; --canal-deep: #a9dde3; --water: #143a44; --paper: #0e1f23;
    --ink: #e6f1ef; --muted: #8fa9b0; --line: #24424a; --card: #152c32;
    --on-canal: #08262d; --footer-bg: #071619; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canal: #6cc4d1; --canal-deep: #a9dde3; --water: #143a44; --paper: #0e1f23;
    --ink: #e6f1ef; --muted: #8fa9b0; --line: #24424a; --card: #152c32;
    --on-canal: #08262d; --footer-bg: #071619; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.6;
  }
  a { color: var(--canal); }
  a:focus-visible, button:focus-visible {
    outline: 3px solid var(--sun);
    outline-offset: 2px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* Qoralama belgisi */
  .draft {
    background: var(--sun);
    color: var(--on-sun);
    font-size: 14px;
    font-weight: 500;
    padding: 8px 20px;
    text-align: center;
  }

  /* Sarlavha qismi */
  .top {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
  }
  .top .wrap {
    display: flex;
    align-items: center;
    gap: 12px 24px;
    flex-wrap: wrap;
    padding-top: 12px;
    padding-bottom: 12px;
  }
  .brand {
    font-family: var(--display);
    font-weight: 800;
    font-size: 18px;
    color: var(--canal);
    text-decoration: none;
    margin-right: auto;
  }
  .top nav { display: flex; gap: 4px 20px; flex-wrap: wrap; }
  .top nav a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
    font-size: 15px;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
  }
  .top nav a:hover { border-bottom-color: var(--sun); }
  .langs { display: flex; border: 1px solid var(--canal); border-radius: 999px; overflow: hidden; }
  .langs button {
    font: 500 13px var(--body);
    padding: 6px 12px;
    border: 0;
    background: transparent;
    color: var(--canal);
    cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--canal); color: var(--on-canal); }

  /* Bosh qism */
  .hero { background: var(--water); overflow: hidden; }
  .hero .wrap > * { min-width: 0; }
  .hero .wrap {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: end;
    gap: 16px 48px;
    padding-top: 56px;
    padding-bottom: 40px;
  }
  .num {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(6.5rem, 24vw, 17rem);
    line-height: .8;
    letter-spacing: -.04em;
    color: var(--canal);
    margin: 0;
  }
  .hero h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(1.4rem, 3vw, 2.1rem);
    line-height: 1.2;
    margin: 0 0 10px;
  }
  .place { font-weight: 500; color: var(--canal-deep); margin: 0 0 14px; }
  .lead { margin: 0; max-width: 46ch; }
  .wave { display: block; width: 100%; height: 44px; }
  @media (max-width: 760px) {
    .hero .wrap { grid-template-columns: 1fr; padding-top: 36px; }
  }

  /* Bo'limlar */
  section { padding: 64px 0; }
  section + section { border-top: 1px solid var(--line); }
  h2 {
    text-wrap: balance;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(1.5rem, 3.2vw, 2rem);
    line-height: 1.2;
    margin: 0 0 28px;
  }
  h3 { font-size: 1.05rem; margin: 0 0 12px; }

  .about { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; }
  .about p { margin: 0 0 28px; max-width: 60ch; }
  .has { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 28px; }
  .has li { padding: 7px 0 7px 22px; position: relative; break-inside: avoid; }
  .has li::before {
    content: "";
    position: absolute; left: 0; top: 16px;
    width: 12px; height: 4px; border-radius: 2px;
    background: var(--sun);
  }
  .facts {
    background: var(--canal);
    color: var(--on-canal);
    border-radius: 6px 28px 6px 6px;
    padding: 24px 26px;
    margin: 0;
  }
  .facts div { padding: 10px 0; }
  .facts div + div { border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
  .facts dt { font-size: 14px; opacity: .8; }
  .facts dd { margin: 0; font-weight: 500; font-size: 1.05rem; }
  .facts .todo dd { font-weight: 400; font-style: italic; opacity: .75; }
  @media (max-width: 760px) {
    .about { grid-template-columns: 1fr; }
    .has { columns: 1; }
  }

  /* Yangiliklar */
  .news { list-style: none; margin: 0; padding: 0; }
  .news li {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 6px 28px;
    padding: 22px 0;
    border-top: 1px solid var(--line);
  }
  .news li:first-child { border-top: 0; padding-top: 0; }
  .news time, .news .when { font-family: var(--display); font-weight: 500; font-size: 14px; color: var(--canal); padding-top: 4px; }
  .news h3 { margin-bottom: 6px; font-size: 1.15rem; }
  .news p { margin: 0; max-width: 64ch; }
  .news .src { font-size: 14px; display: inline-block; margin-top: 6px; }
  @media (max-width: 600px) { .news li { grid-template-columns: 1fr; } }

  /* O'qituvchilar va to'garaklar */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  .people, .clubs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .people li, .clubs li {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--canal);
    border-radius: 4px;
    padding: 12px 16px;
  }
  .people strong, .clubs strong { display: block; }
  .people span, .clubs span { color: var(--muted); font-size: 15px; }
  .note { color: var(--muted); font-size: 15px; margin: 0 0 16px; max-width: 52ch; }

  /* To'ldirilishi kerak bo'lgan joylar */
  li.todo {
    background: transparent;
    border: 1.5px dashed var(--muted);
    border-left: 1.5px dashed var(--muted);
    color: var(--muted);
  }
  .news li.todo { border: 0; border-top: 1px solid var(--line); }
  .news li.todo h3, .news li.todo p { color: var(--muted); font-style: italic; }
  .tag {
    display: inline-block;
    background: var(--sun);
    color: var(--on-sun);
    font-size: 12px;
    font-weight: 500;
    font-style: normal;
    border-radius: 3px;
    padding: 1px 7px;
    margin-left: 6px;
    vertical-align: middle;
  }

  footer { background: var(--footer-bg); color: var(--footer-fg); padding: 44px 0; }
  footer h2 { color: var(--footer-fg); margin-bottom: 16px; }
  footer p { margin: 0 0 6px; }
  footer .small { font-size: 14px; opacity: .75; margin-top: 22px; }
</style>
</head>

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function fill(id, items, build) {
  const box = document.getElementById(id);
  box.textContent = "";
  items.forEach(function (item) { box.appendChild(build(item)); });
}
function tag(lang) { return el("span", "tag", T[lang].todo); }

function render(lang) {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function (node) {
    node.textContent = T[lang][node.dataset.t];
  });
  document.querySelectorAll("[data-lang]").forEach(function (btn) {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
  });

  fill("facts", FACTS, function (f) {
    const row = el("div", f.todo ? "todo" : "");
    row.appendChild(el("dt", "", f.label[lang]));
    row.appendChild(el("dd", "", f.value[lang]));
    return row;
  });

  fill("has", HAS, function (h) { return el("li", "", h[lang]); });

  fill("newsList", NEWS, function (n) {
    const li = el("li", n.todo ? "todo" : "");
    li.appendChild(el("div", "when", n.when[lang]));
    const body = el("div");
    const h = el("h3", "", n.title[lang]);
    if (n.todo) h.appendChild(tag(lang));
    body.appendChild(h);
    body.appendChild(el("p", "", n.text[lang]));
    if (n.src) {
      const a = el("a", "src", T[lang].source + ": " + new URL(n.src).hostname);
      a.href = n.src; a.target = "_blank"; a.rel = "noopener";
      body.appendChild(a);
    }
    li.appendChild(body);
    return li;
  });

  fill("teachers", TEACHERS, function (t) {
    const li = el("li", t.todo ? "todo" : "");
    const name = el("strong", "", t.name[lang]);
    if (t.todo) name.appendChild(tag(lang));
    li.appendChild(name);
    li.appendChild(el("span", "", t.subject[lang]));
    return li;
  });

  fill("clubs", CLUBS, function (c) {
    const li = el("li", c.todo ? "todo" : "");
    const name = el("strong", "", c.name[lang]);
    if (c.todo) name.appendChild(tag(lang));
    li.appendChild(name);
    li.appendChild(el("span", "", c.info[lang]));
    return li;
  });
}

let saved = null;
try { saved = localStorage.getItem("lang"); } catch (e) {}
render(T[saved] ? saved : "uz");

document.querySelectorAll("[data-lang]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    render(btn.dataset.lang);
    try { localStorage.setItem("lang", btn.dataset.lang); } catch (e) {}
  });
});
</script>
