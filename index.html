<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>358-maktab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tartib: rasmiy muassasa sayti kabi. Tepada xizmat qatori, nishon va nom,
     yopishib turadigan menyu, so'ng rasm bilan bosh qism va bo'limlar. */
  :root {
    --bg: #ffffff;
    --soft: #f3f7fb;
    --tint: #e4effa;
    --ink: #0a1624;
    --muted: #3b4c60;
    --line: #d3dfea;
    --accent: #0f58b8;
    --accent2: #0b7f8c;
    --glow: rgba(11, 127, 140, .16);
    --on-accent: #ffffff;
    --gold: #f0b400;
    --on-gold: #1d2530;
    --card: #ffffff;
    --shade: rgba(23, 40, 58, .10);
    --font: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #090f1f; --soft: #0e1730; --tint: #16234a; --ink: #f2f6fc; --muted: #aebbd0;
      --line: #263660; --accent: #63a9ff; --accent2: #3ee0c4; --glow: rgba(62, 224, 196, .20);
      --on-accent: #06132a; --gold: #ffc93c;
      --card: #111b38; --shade: rgba(0, 0, 0, .45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #090f1f; --soft: #0e1730; --tint: #16234a; --ink: #f2f6fc; --muted: #aebbd0;
    --line: #263660; --accent: #63a9ff; --accent2: #3ee0c4; --glow: rgba(62, 224, 196, .20);
    --on-accent: #06132a; --gold: #ffc93c;
    --card: #111b38; --shade: rgba(0, 0, 0, .45); color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 70px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 17px; line-height: 1.6;
    transition: background-color .3s, color .3s;
  }
  a { color: var(--accent); }
  button { font-family: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  h2 { font-weight: 700; font-size: clamp(1.45rem, 3vw, 1.9rem); line-height: 1.2; margin: 0 0 28px; text-wrap: balance; }
  h2::after { content: ""; display: block; width: 64px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--gold), var(--accent2)); margin-top: 12px; }
  h3 { font-size: 1.05rem; margin: 0 0 12px; }
  .note { color: var(--muted); font-size: 15px; margin: -12px 0 24px; max-width: 60ch; }

  /* Xizmat qatori */
  .util { background: var(--soft); border-bottom: 1px solid var(--line); font-size: 14px; }
  .util .wrap { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding-top: 7px; padding-bottom: 7px; }
  .util .state { margin-right: auto; color: var(--muted); min-width: 0; }
  .util .state b { background: var(--gold); color: var(--on-gold); font-weight: 600; border-radius: 3px; padding: 1px 7px; margin-right: 6px; }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
  .langs button { font-weight: 500; font-size: 13px; padding: 5px 11px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .theme {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink);
    font-size: 13px; font-weight: 500; padding: 5px 12px 5px 9px;
  }
  .theme svg { width: 16px; height: 16px; display: block; }
  .theme .moon { display: none; }
  :root[data-mode="dark"] .theme .sun { display: none; }
  :root[data-mode="dark"] .theme .moon { display: block; }

  /* Nishon va nom */
  .mast .wrap { display: flex; align-items: center; gap: 16px; padding-top: 18px; padding-bottom: 18px; }
  .seal {
    flex: none; width: 62px; height: 62px; border-radius: 50%;
    border: 2px solid var(--accent); outline: 1px solid var(--line); outline-offset: 3px;
    display: grid; place-items: center; color: var(--accent); font-weight: 800; font-size: 20px; letter-spacing: -.02em;
    text-decoration: none; background: var(--card);
  }
  .mast .names { min-width: 0; }
  .mast .over { font-size: 14px; color: var(--muted); margin: 0; }
  .mast .title { font-weight: 700; font-size: clamp(1.05rem, 2.4vw, 1.35rem); line-height: 1.25; margin: 0; }

  /* Menyu */
  .menu { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .menu nav { display: flex; gap: 4px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .menu a {
    color: var(--ink); text-decoration: none; font-weight: 500; font-size: 15px;
    padding: 13px 14px; border-bottom: 3px solid transparent; transition: color .2s, border-color .2s;
  }
  .menu a:hover, .menu a.on { color: var(--accent); border-bottom-color: var(--accent); }

  /* Bosh qism */
  .hero { background: radial-gradient(60% 90% at 88% 0%, var(--glow), transparent 70%), linear-gradient(var(--tint), var(--soft)); }
  .hero .wrap { display: grid; grid-template-columns: 1fr 1.1fr; gap: 32px 48px; align-items: center; padding-top: 48px; padding-bottom: 88px; }
  .hero .wrap > * { min-width: 0; }
  .hero h1 { font-weight: 800; font-size: clamp(1.8rem, 4.2vw, 2.9rem); line-height: 1.12; letter-spacing: -.02em; margin: 0 0 14px; text-wrap: balance; }
  .hero .place { color: var(--accent); font-weight: 600; margin: 0 0 12px; }
  .hero .lead { margin: 0 0 26px; max-width: 46ch; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-block; font-weight: 600; text-decoration: none; padding: 12px 22px; border-radius: 8px; border: 1.5px solid var(--accent); transition: transform .2s; }
  .btn.fill { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on-accent); border-color: transparent; }
  .btn:hover { transform: translateY(-2px); }

  .shot { margin: 0; position: relative; }
  .shot .frame { border-radius: 14px; overflow: hidden; background: var(--tint); box-shadow: 0 18px 40px var(--shade); max-width: 100%; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .shot figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .hero .frame { aspect-ratio: 3 / 2; }

  /* Raqamlar qatori */
  .strip { margin-top: -44px; position: relative; z-index: 1; }
  .strip dl {
    margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 30px var(--shade);
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .strip dl div { padding: 18px 22px; min-width: 0; }
  .strip dl div + div { border-left: 1px solid var(--line); }
  .strip dt { font-size: 14px; color: var(--muted); }
  .strip dd { margin: 0; font-weight: 700; font-size: 1.2rem; }
  @media (max-width: 760px) {
    .strip dl { grid-template-columns: 1fr 1fr; }
    .strip dl div:nth-child(3) { border-left: 0; }
    .strip dl div:nth-child(n+3) { border-top: 1px solid var(--line); }
  }

  /* Tezkor havolalar */
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding-top: 28px; }
  .quick a {
    display: flex; align-items: center; gap: 12px; min-width: 0;
    background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    color: var(--ink); text-decoration: none; font-weight: 600; transition: transform .2s, border-color .2s;
  }
  .quick a:hover { transform: translateY(-3px); border-color: var(--accent); }
  .quick svg { flex: none; width: 26px; height: 26px; color: var(--accent); }
  @media (max-width: 760px) { .quick { grid-template-columns: 1fr 1fr; } }

  section { padding: 64px 0; }
  section.alt { background: var(--soft); }

  /* Maktab haqida */
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .about > * { min-width: 0; }
  .about p { margin: 0 0 24px; max-width: 58ch; }
  .has { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 24px; }
  .has li { padding: 6px 0 6px 22px; position: relative; break-inside: avoid; }
  .has li::before { content: ""; position: absolute; left: 0; top: 15px; width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid var(--accent); }
  .collage { position: relative; padding: 0 0 70px 0; }
  .collage .a .frame { aspect-ratio: 3 / 2; width: 84%; }
  .collage .b { position: absolute; right: 0; bottom: 0; width: 52%; }
  .collage .b .frame { aspect-ratio: 3 / 2; border: 5px solid var(--bg); }
  .collage .b figcaption { text-align: right; }
  .credit { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
  @media (max-width: 800px) { .hero .wrap, .about { grid-template-columns: 1fr; } .has { columns: 1; } }

  /* Direktor */
  .director { display: grid; grid-template-columns: 210px 1fr; gap: 36px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 26px; }
  .director > * { min-width: 0; }
  .portrait { aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: var(--tint); display: grid; place-items: center; font-weight: 800; font-size: 3rem; color: var(--accent); max-width: 100%; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .director .role { color: var(--accent); font-weight: 600; margin: 0 0 4px; }
  .director .name { font-weight: 700; font-size: 1.4rem; margin: 0 0 12px; }
  .director .bio { margin: 0 0 20px; max-width: 60ch; }
  .dfacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 28px; margin: 0; }
  .dfacts dt { font-size: 14px; color: var(--muted); }
  .dfacts dd { margin: 0; font-weight: 600; }
  @media (max-width: 640px) { .director { grid-template-columns: 1fr; } .portrait { max-width: 190px; } }

  /* Sinflar */
  .sample { border: 1.5px dashed var(--gold); border-radius: 8px; padding: 12px 16px; margin: 0 0 28px; font-size: 15px; max-width: 72ch; }
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 0 0 12px; }
  .totals div { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent2); border-radius: 10px; padding: 14px 18px; min-width: 0; }
  .totals dt { color: var(--muted); font-size: 15px; }
  .totals dd { margin: 0; font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.4rem); color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.15; }
  .hint { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
  .stage { font-size: 15px; font-weight: 700; color: var(--accent); margin: 28px 0 6px; }
  .grade { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px 20px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .grade > * { min-width: 0; }
  .grade .g { font-weight: 700; font-size: 1.05rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    text-align: left; cursor: pointer; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px 9px; min-width: 84px;
    transition: transform .2s, border-color .2s, background-color .2s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-expanded="true"] { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: var(--on-accent); }
  .chip b { display: block; font-size: 15px; }
  .chip span { font-size: 14px; opacity: .75; font-variant-numeric: tabular-nums; }
  .chip .bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; opacity: 1; }
  .chip i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transform-origin: left; }
  .chip[aria-expanded="true"] i { background: var(--on-accent); }
  .grade .sum { font-size: 15px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .detail { background: var(--tint); border-radius: 10px; padding: 18px 20px; margin: 0 0 14px; }
  .detail .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .detail h4 { margin: 0 auto 0 0; font-size: 1.15rem; }
  .detail .x { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
  .detail dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 24px; margin: 0 0 12px; }
  .detail dt { font-size: 14px; color: var(--muted); }
  .detail dd { margin: 0; font-weight: 600; }
  .detail dd.soon { font-weight: 400; font-style: italic; color: var(--muted); }
  .detail p { margin: 0; font-size: 14px; color: var(--muted); max-width: 70ch; }
  @media (max-width: 640px) {
    .grade { grid-template-columns: 1fr auto; }
    .grade .chips { grid-column: 1 / -1; order: 3; }
    .totals { grid-template-columns: 1fr; }
  }

  /* O'qituvchilar va to'garaklar */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; list-style: none; margin: 0; padding: 0; }
  .tcard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; gap: 14px; align-items: center; min-width: 0; }
  .avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: var(--tint); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tcard div { min-width: 0; }
  .tcard strong { display: block; line-height: 1.3; }
  .tcard .sub { color: var(--accent); font-size: 15px; font-weight: 500; }
  .tcard .exp { color: var(--muted); font-size: 14px; display: block; }
  .club { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 14px 16px; }
  .club strong { display: block; }
  .club span { color: var(--muted); font-size: 15px; }

  .todo { border-style: dashed; border-color: var(--muted); }
  .todo strong, .todo .name, .todo .bio { color: var(--muted); }
  .todo .bio { font-style: italic; }
  .tag { display: inline-block; background: var(--gold); color: var(--on-gold); font: 500 12px var(--font); border-radius: 3px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }

  /* Yangiliklar */
  .news { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .news li { display: grid; grid-template-columns: 120px 1fr; gap: 6px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; }
  .news li > * { min-width: 0; }
  .news .when { font-weight: 700; font-size: 14px; color: var(--accent); padding-top: 3px; }
  .news h3 { margin-bottom: 6px; font-size: 1.12rem; }
  .news p { margin: 0; max-width: 64ch; }
  .news .src { font-size: 14px; display: inline-block; margin-top: 6px; }
  .news li.todo h3, .news li.todo p { color: var(--muted); font-style: italic; }
  @media (max-width: 600px) { .news li { grid-template-columns: 1fr; } }

  footer { background: var(--soft); border-top: 4px solid var(--accent2); padding: 44px 0 30px; }
  footer .cols { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 28px; }
  footer .cols > * { min-width: 0; }
  footer h2 { font-size: 1.1rem; margin-bottom: 14px; }
  footer h2::after { display: none; }
  footer p { margin: 0 0 6px; font-size: 15px; }
  footer .small { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 26px; padding-top: 16px; }
  @media (max-width: 700px) { footer .cols { grid-template-columns: 1fr; } }

  /* Harakat: faqat "harakatni kamaytirish" yoqilmagan bo'lsa */
  @media (prefers-reduced-motion: no-preference) {
    .hero h1, .hero .place, .hero .lead, .btns { animation: rise .7s ease-out both; }
    .hero h1 { animation-delay: .1s; } .hero .lead { animation-delay: .2s; } .btns { animation-delay: .3s; }
    .hero .shot { animation: unveil 1s cubic-bezier(.2, .8, .2, 1) .15s both; }
    .rv { transition: opacity .7s ease-out, transform .7s ease-out; }
    .rv.rv-wait { opacity: .12; transform: translateY(34px); }
    .chip i { transition: transform .9s cubic-bezier(.2, .8, .2, 1); transition-delay: calc(var(--n) * 35ms); }
    .rv-wait .chip i { transform: scaleX(0); }
    .chip:hover, .tcard:hover, .club:hover { transform: translateY(-3px); }
    .tcard, .club { transition: transform .2s; }
    .detail { animation: open .35s ease-out both; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  @keyframes unveil { from { opacity: 0; transform: translateX(40px) scale(.96); } }
  @keyframes open { from { opacity: 0; transform: translateY(-8px); } }
</style>
</head>
<body>

<div class="util">
  <div class="wrap">
    <span class="state"><b data-t="draftTag"></b><span data-t="draft"></span></span>
    <div class="langs" role="group" aria-label="Til / Язык / Language">
      <button type="button" data-lang="uz">O‘zb</button>
      <button type="button" data-lang="ru">Рус</button>
      <button type="button" data-lang="en">Eng</button>
    </div>
    <button type="button" class="theme" id="themeBtn">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span id="themeLabel"></span>
    </button>
  </div>
</div>

<header class="mast" id="top">
  <div class="wrap">
    <a class="seal" href="#top" aria-hidden="true" tabindex="-1">358</a>
    <div class="names">
      <p class="over" data-t="over"></p>
      <p class="title" data-t="h1"></p>
    </div>
  </div>
</header>

<div class="menu">
  <div class="wrap">
    <nav aria-label="Bo'limlar">
      <a href="#about" data-t="navAbout"></a>
      <a href="#director" data-t="navDirector"></a>
      <a href="#classes" data-t="navClasses"></a>
      <a href="#teachers" data-t="navTeachers"></a>
      <a href="#clubs" data-t="navClubs"></a>
      <a href="#news" data-t="navNews"></a>
      <a href="#contact" data-t="navContact"></a>
    </nav>
  </div>
</div>

<main>
  <div class="hero">
    <div class="wrap">
      <div>
        <p class="place" data-t="place"></p>
        <h1 data-t="h1"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="btns">
          <a class="btn fill" href="#classes" data-t="cta"></a>
          <a class="btn" href="#contact" data-t="navContact"></a>
        </div>
      </div>
      <figure class="shot">
        <div class="frame"><img src="rasmlar/maktab.jpg" data-par="1" width="764" height="526" alt="" data-alt="altSchool"></div>
        <figcaption data-t="capSchool"></figcaption>
      </figure>
    </div>
  </div>

  <div class="wrap strip rv"><dl id="facts"></dl></div>

  <div class="wrap quick rv">
    <a href="#director"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span data-t="navDirector"></span></a>

    contactAddress: "Address: to be added", contactPhone: "Phone: to be added", contactHours: "Office hours: to be added",
    linksTitle: "Useful links", linkVisit: "About the President's visit", linkHokim: "Bektemir district administration",
    footNote: "This draft was prepared by a student of the school.",
    todo: "to fill in"
  }
};

/* =====================================================================
   3-QISM. SAHIFANI CHIZISH VA ANIMATSIYALAR (bu yerga tegish shart emas)
   ===================================================================== */

const CALM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let LANG = "uz";
let OPEN = null;   /* ochiq turgan sinf, masalan "7-A" */

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function fill(id, items, build) {
  const box = document.getElementById(id);
  box.textContent = "";
  items.forEach(function (item, i) { box.appendChild(build(item, i)); });
  return box;
}
function tag() { return el("span", "tag", T[LANG].todo); }
function initials(name) {
  return name.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
}
function photoInto(box, src, alt) {
  if (!src) return;
  const img = new Image();
  img.alt = alt;
  img.onload = function () { box.textContent = ""; box.appendChild(img); };
  img.src = src;
}
function pair(dl, label, value, soon) {
  const row = el("div");
  row.appendChild(el("dt", "", label));
  row.appendChild(el("dd", soon ? "soon" : "", value));
  dl.appendChild(row);
}

function totals() {
  let students = 0, classes = 0, max = 0;
  CLASSES.forEach(function (c) {
    Object.keys(c.groups).forEach(function (k) {
      students += c.groups[k]; classes += 1; max = Math.max(max, c.groups[k]);
    });
  });
  return { students: students, classes: classes, avg: classes ? Math.round(students / classes) : 0, max: max };
}

/* Sinf ustiga bosilganda chiqadigan oyna */
function detailBox(id, count) {
  const L = T[LANG];
  const info = CLASS_INFO[id] || {};
  const box = el("div", "detail");
  box.setAttribute("role", "region");
  const head = el("div", "head");
  head.appendChild(el("h4", "", L.detailTitle(id)));
  const x = el("button", "x", L.close);
  x.type = "button";
  x.addEventListener("click", function () { OPEN = null; renderGrades(); });
  head.appendChild(x);
  box.appendChild(head);
  const dl = el("dl");
  pair(dl, L.dCount, String(count));
  if (info.boys !== undefined) pair(dl, L.dBoys, String(info.boys));
  if (info.girls !== undefined) pair(dl, L.dGirls, String(info.girls));
  pair(dl, L.dTeacher, info.teacher || L.soon, !info.teacher);
  pair(dl, L.dRoom, info.room || L.soon, !info.room);
  pair(dl, L.dShift, info.shift ? L.shiftName(info.shift) : L.soon, !info.shift);
  box.appendChild(dl);
  box.appendChild(el("p", "", L.privacy));
  return box;
}

function renderGrades() {
  const L = T[LANG];
  const tot = totals();
  const grades = document.getElementById("grades");
  grades.textContent = "";
  let n = 0;
  STAGES.forEach(function (stage) {
    const rows = CLASSES.filter(function (c) { return c.grade >= stage.from && c.grade <= stage.to; });
    if (!rows.length) return;
    grades.appendChild(el("h3", "stage", stage.name[LANG]));
    rows.forEach(function (c) {
      const row = el("div", "grade");
      row.appendChild(el("div", "g", L.gradeName(c.grade)));
      const chips = el("div", "chips");
      let sum = 0, opened = null;
      const keys = Object.keys(c.groups);
      keys.forEach(function (k) {
        const count = c.groups[k];
        const id = c.grade + "-" + k;
        sum += count;
        const chip = el("button", "chip");
        chip.type = "button";
        chip.style.setProperty("--n", n++);
        chip.setAttribute("aria-expanded", String(OPEN === id));
        chip.appendChild(el("b", "", id));
        chip.appendChild(el("span", "", L.pupils(count)));
        const bar = el("span", "bar");
        const inner = el("i");
        inner.style.width = Math.round(count / tot.max * 100) + "%";
        bar.appendChild(inner);
        chip.appendChild(bar);
        chip.addEventListener("click", function () { OPEN = OPEN === id ? null : id; renderGrades(); });
        chips.appendChild(chip);
        if (OPEN === id) opened = detailBox(id, count);
      });
      row.appendChild(chips);
      row.appendChild(el("div", "sum", L.gradeSum(keys.length, sum)));
      grades.appendChild(row);
      if (opened) grades.appendChild(opened);
    });
  });
}

function setThemeLabel() {
  const dark = document.documentElement.dataset.mode === "dark";
  document.getElementById("themeLabel").textContent = dark ? T[LANG].themeLight : T[LANG].themeDark;
}

function render(lang) {
  LANG = lang;
  const L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function (node) { node.textContent = L[node.dataset.t]; });
  document.querySelectorAll("[data-alt]").forEach(function (node) { node.alt = L[node.dataset.alt]; });
  document.querySelectorAll("[data-lang]").forEach(function (btn) {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
  });
  setThemeLabel();

  fill("facts", FACTS, function (f) {
    const row = el("div");
    row.appendChild(el("dt", "", f.label[lang]));
    row.appendChild(el("dd", "", f.value[lang]));
    return row;
  });
  fill("has", HAS, function (h) { return el("li", "", h[lang]); });

  const dbox = document.getElementById("directorBox");
  dbox.textContent = "";
  dbox.classList.toggle("todo", !!DIRECTOR.todo);
  const portrait = el("div", "portrait", DIRECTOR.todo ? "?" : initials(DIRECTOR.name[lang]));
  photoInto(portrait, DIRECTOR.photo, DIRECTOR.name[lang]);
  dbox.appendChild(portrait);
  const dtext = el("div");
  dtext.appendChild(el("p", "role", L.directorRole));
  const dname = el("p", "name", DIRECTOR.name[lang]);
  if (DIRECTOR.todo) dname.appendChild(tag());
  dtext.appendChild(dname);
  dtext.appendChild(el("p", "bio", DIRECTOR.bio[lang]));
  const dl = el("dl", "dfacts");
  DIRECTOR.facts.forEach(function (f) { pair(dl, f.label[lang], f.value[lang]); });
  dtext.appendChild(dl);
  dbox.appendChild(dtext);

  const tot = totals();
  document.getElementById("sampleNote").hidden = !CLASSES_SAMPLE;
  fill("totals", [[L.totStudents, tot.students], [L.totClasses, tot.classes], [L.totAvg, tot.avg]], function (p) {
    const row = el("div");
    row.appendChild(el("dt", "", p[0]));
    const dd = el("dd", "", String(p[1]));
    dd.dataset.count = p[1];
    row.appendChild(dd);
    return row;
  });
  renderGrades();

  fill("teacherList", TEACHERS, function (t) {
    const li = el("li", "tcard" + (t.todo ? " todo" : ""));
    const av = el("span", "avatar", t.todo ? "?" : initials(t.name[lang]));
    photoInto(av, t.photo, t.name[lang]);
    li.appendChild(av);
    const body = el("div");
    const name = el("strong", "", t.name[lang]);
    if (t.todo) name.appendChild(tag());
    body.appendChild(name);
    body.appendChild(el("span", "sub", t.subject[lang]));
    if (t.exp) body.appendChild(el("span", "exp", t.exp[lang]));
    li.appendChild(body);
    return li;
  });

  fill("clubList", CLUBS, function (c) {
    const li = el("li", "club" + (c.todo ? " todo" : ""));
    const name = el("strong", "", c.name[lang]);
    if (c.todo) name.appendChild(tag());
    li.appendChild(name);
    li.appendChild(el("span", "", c.info[lang]));
    return li;
  });

  fill("newsList", NEWS, function (item) {
    const li = el("li", item.todo ? "todo" : "");
    li.appendChild(el("div", "when", item.when[lang]));
    const body = el("div");
    const h = el("h3", "", item.title[lang]);
    if (item.todo) h.appendChild(tag());
    body.appendChild(h);
    body.appendChild(el("p", "", item.text[lang]));
    if (item.src) {
      const a = el("a", "src", L.source + ": " + new URL(item.src).hostname);
      a.href = item.src; a.target = "_blank"; a.rel = "noopener";
      body.appendChild(a);
    }
    li.appendChild(body);
    return li;
  });
}

/* Tungi va kunduzgi rejim */
(function () {
  const root = document.documentElement;
  const sys = window.matchMedia("(prefers-color-scheme: dark)");
  function current() { return root.dataset.theme || (sys.matches ? "dark" : "light"); }
  function sync() { root.dataset.mode = current(); setThemeLabel(); }
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved === "dark" || saved === "light") root.dataset.theme = saved;
  root.dataset.mode = current();
  document.getElementById("themeBtn").addEventListener("click", function () {
    const next = current() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    sync();
  });
  sys.addEventListener("change", sync);
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
})();

/* Sonlarni noldan sanab chiqish */
function countUp(scope) {
  if (CALM) return;
  scope.querySelectorAll("[data-count]").forEach(function (node) {
    const to = Number(node.dataset.count);
    const start = performance.now();
    function step(now) {
      const p = Math.min(1, (now - start) / 1100);
      node.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* Bo'limlar ekranga kirganda ko'tarilib chiqadi */
function setupReveal() {
  if (CALM || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.remove("rv-wait");
      countUp(e.target);
      io.unobserve(e.target);
    });
  }, { rootMargin: "0px 0px -10% 0px" });
  document.querySelectorAll(".rv").forEach(function (node) {
    if (node.getBoundingClientRect().top > window.innerHeight * 0.9) {
      node.classList.add("rv-wait");
      io.observe(node);
    }
  });
}

/* Pastga aylantirilganda rasmlar siljiydi va kattalashadi */
function setupScrollPhotos() {
  if (CALM) return;
  const imgs = Array.prototype.slice.call(document.querySelectorAll("[data-par]"));
  const floats = Array.prototype.slice.call(document.querySelectorAll("[data-float]"));
  let queued = false;
  function place() {
    queued = false;
    const vh = window.innerHeight;
    imgs.forEach(function (img) {
      const r = img.parentElement.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) return;
      const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / vh));
      img.style.transform = "translate3d(0," + (p * -26).toFixed(1) + "px,0) scale(" + (1.16 - p * 0.08).toFixed(3) + ")";
    });
    floats.forEach(function (fig) {
      const r = fig.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) return;
      const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / vh));
      fig.style.transform = "translate3d(0," + (p * 28 * Number(fig.dataset.float)).toFixed(1) + "px,0)";
    });
  }
  function ask() { if (!queued) { queued = true; requestAnimationFrame(place); } }
  window.addEventListener("scroll", ask, { passive: true });
  window.addEventListener("resize", ask);
  place();
}

/* Menyuda qaysi bo'lim ochiqligini belgilash */
function setupMenu() {
  if (!("IntersectionObserver" in window)) return;
  const links = {};
  document.querySelectorAll(".menu a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      Object.keys(links).forEach(function (k) { links[k].classList.toggle("on", k === e.target.id); });
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  Object.keys(links).forEach(function (k) { const s = document.getElementById(k); if (s) io.observe(s); });
}

let savedLang = null;
try { savedLang = localStorage.getItem("lang"); } catch (e) {}
render(T[savedLang] ? savedLang : "uz");
setupReveal();
setupScrollPhotos();
setupMenu();

document.querySelectorAll("[data-lang]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    render(btn.dataset.lang);
    try { localStorage.setItem("lang", btn.dataset.lang); } catch (e) {}
  });
});
</script>
