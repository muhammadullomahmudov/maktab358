<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>358-maktab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Uslub: zamonaviy "bento" kataklar, shisha menyu va 3D elementlar.
     Ranglar atayin kam: neytral fon, bitta kobalt ko'k va ozgina kahrabo sariq. */
  :root {
    --bg: #f3f4f8;
    --card: #ffffff;
    --glass: rgba(255, 255, 255, .72);
    --ink: #0a0e1c;
    --muted: #474e66;
    --line: #dfe2ec;
    --a: #2447f9;             /* kobalt ko'k */
    --a-soft: #e6ebff;
    --on-a: #ffffff;
    --b: #ffab1a;             /* kahrabo sariq */
    --on-b: #1d1400;
    --shadow: 0 1px 2px rgba(10, 14, 28, .06), 0 12px 32px rgba(10, 14, 28, .08);
    --deep: 0 30px 60px rgba(10, 14, 28, .22);
    --exit: #0c7d43;
    --roof: #b5473c;
    --bgop: .28;
    --r: 22px;
    --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #06070c; --card: #10121b; --glass: rgba(16, 18, 27, .72); --ink: #f4f6fc; --muted: #a7aec5;
      --line: #232737; --a: #7d95ff; --a-soft: #171d3d; --on-a: #05081a; --b: #ffc04d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45);
      --deep: 0 30px 70px rgba(0, 0, 0, .7); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #06070c; --card: #10121b; --glass: rgba(16, 18, 27, .72); --ink: #f4f6fc; --muted: #a7aec5;
    --line: #232737; --a: #7d95ff; --a-soft: #171d3d; --on-a: #05081a; --b: #ffc04d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .45);
    --deep: 0 30px 70px rgba(0, 0, 0, .7); color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; transition: background-color .35s, color .35s; overflow-x: clip; }
  a { color: var(--a); }
  button { font-family: inherit; color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--b); outline-offset: 2px; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; position: relative; }
  section { padding: 54px 0; position: relative; }

  h2 { font-weight: 800; font-size: clamp(1.9rem, 5vw, 3.1rem); line-height: 1.02; letter-spacing: -.035em; margin: 0 0 22px; text-wrap: balance; }
  h3 { font-size: 1.02rem; margin: 0 0 10px; letter-spacing: -.01em; }
  .note { color: var(--muted); font-size: 16px; margin: -8px 0 22px; max-width: 62ch; }
  .fine { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
  .tag { display: inline-block; background: var(--b); color: var(--on-b); font: 600 11px var(--font); border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; letter-spacing: 0; }
  .paper, .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  .sample { border: 1.5px dashed var(--b); border-radius: 14px; padding: 11px 15px; margin: 0 0 22px; font-size: 14px; max-width: 74ch; background: var(--card); }

  /* Orqa fon: 3D maktab maketi, ostida mahalla rasmi */
  .bg3d { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; perspective: 1300px; opacity: var(--bgop); }
  .bg3d::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 55%, transparent 30%, var(--bg) 100%); }
  .bgscale { position: absolute; left: 50%; top: 60%; width: 0; height: 0; transform-style: preserve-3d; transform: scale(var(--bgs, 1)); }
  .bgworld { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform: rotateX(-24deg) rotateY(-32deg); }
  .bgground { position: absolute; display: block; width: 1400px; max-width: none; height: 930px; left: -700px; top: -465px; transform: rotateX(90deg); object-fit: cover; }
  .util, .hero, .marquee, main, footer { position: relative; z-index: 1; }
  footer { background: var(--bg); }
  @media (max-width: 900px) { .bg3d { --bgs: .5; } }

  /* Tepadagi qator */
  .util .wrap { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding-top: 14px; padding-bottom: 6px; }
  .stamp { margin-right: auto; font-weight: 700; font-size: 12px; background: var(--b); color: var(--on-b); border-radius: 999px; padding: 4px 12px; }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); padding: 3px; gap: 2px; }
  .langs button { font-weight: 600; font-size: 13px; padding: 4px 10px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .theme { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 600; padding: 7px 13px 7px 10px; }
  .theme svg { width: 16px; height: 16px; display: block; }
  .theme .moon { display: none; }
  :root[data-mode="dark"] .theme .sun { display: none; }
  :root[data-mode="dark"] .theme .moon { display: block; }

  /* Bosh qism */
  .hero { position: relative; }
  .hero::before { content: ""; position: absolute; inset: -80px 0 auto 0; height: 620px; pointer-events: none; z-index: 0;
    background: radial-gradient(40% 55% at 78% 30%, color-mix(in srgb, var(--a) 26%, transparent), transparent 70%), radial-gradient(30% 40% at 12% 10%, color-mix(in srgb, var(--b) 16%, transparent), transparent 70%); }
  .hero .wrap { display: grid; grid-template-columns: 1.05fr 1fr; gap: 28px 56px; align-items: center; padding-top: 30px; padding-bottom: 46px; z-index: 1; }
  .hero .wrap > * { min-width: 0; }
  .hero .place { font-weight: 600; font-size: 15px; color: var(--a); margin: 0 0 12px; }
  .hero h1 { font-weight: 800; font-size: clamp(1.7rem, 4vw, 2.7rem); line-height: 1.05; letter-spacing: -.035em; margin: 0 0 16px; text-wrap: balance; }
  .hero h1 em { display: block; font-style: normal; font-size: clamp(5.4rem, 17vw, 11rem); line-height: .82; letter-spacing: -.07em; color: var(--a); margin: 0 0 10px -.04em; text-shadow: 0 1px 0 color-mix(in srgb, var(--a) 70%, #000), 0 2px 0 color-mix(in srgb, var(--a) 62%, #000), 0 3px 0 color-mix(in srgb, var(--a) 54%, #000), 0 4px 0 color-mix(in srgb, var(--a) 46%, #000), 0 5px 0 color-mix(in srgb, var(--a) 40%, #000), 0 6px 0 color-mix(in srgb, var(--a) 34%, #000), 0 18px 30px rgba(10, 14, 28, .28); }
  .hero .lead { margin: 0 0 22px; max-width: 44ch; color: var(--ink); }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-block; font-weight: 700; font-size: 16px; text-decoration: none; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--card); cursor: pointer; box-shadow: 0 4px 0 var(--line); transition: transform .12s, box-shadow .12s; }
  .btn.fill { background: var(--a); color: var(--on-a); border-color: transparent; box-shadow: 0 4px 0 color-mix(in srgb, var(--a) 55%, #000); }
  .btn:hover { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .btn.fill:hover { box-shadow: 0 2px 0 color-mix(in srgb, var(--a) 55%, #000); }
  .btn:active { transform: translateY(4px); box-shadow: none; }

  /* Bosh qismdagi rasm */
  .tilt { position: relative; }
  .snap { margin: 0; position: relative; }
  .snap .frame { overflow: hidden; background: var(--a-soft); border-radius: var(--r); max-width: 100%; position: relative; }
  .snap img { display: block; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .snap figcaption { font-size: 13px; color: var(--muted); padding-top: 8px; }
  .tilt .snap .frame { aspect-ratio: 3 / 2; box-shadow: var(--deep); }
  .chip3 { position: absolute; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow); font-weight: 600; font-size: 13px; line-height: 1.2; }
  .chip3 b { display: block; font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; color: var(--a); }
  .chip3 i { font-style: normal; color: var(--muted); }
  .chip3.c1 { left: -18px; top: 16%; }
  .chip3.c2 { right: -14px; bottom: 24%; }
  .chip3.c3 { right: 9%; top: -16px; background: var(--ink); color: var(--bg); border-color: transparent; }

  /* Hozir maktabda */
  .now { margin-top: 26px; display: flex; gap: 16px; align-items: center; padding: 14px 18px; max-width: 460px; }
  .ring { flex: none; width: 68px; height: 68px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring .track { fill: none; stroke: var(--line); stroke-width: 7; }
  .ring .prog { fill: none; stroke: var(--a); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1.4rem; }
  .now div { min-width: 0; }
  .now .lbl { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }
  .now .what { font-weight: 800; font-size: 1.12rem; margin: 0; line-height: 1.25; letter-spacing: -.02em; }
  .now .left { margin: 0; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .now .left b { color: var(--a); }

  /* Suzib yuruvchi shisha menyu */
  .tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 6; }
  .tabs nav { display: flex; gap: 2px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border: 1px solid var(--line); border-radius: 999px; padding: 5px; box-shadow: var(--shadow); }
  .tabs a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 13px; border-radius: 999px; transition: background-color .2s, color .2s; }
  .tabs a:hover { background: var(--a-soft); }
  .tabs a.on { background: var(--ink); color: var(--bg); }

  /* Yuguruvchi qator */
  .marquee { overflow: hidden; border-block: 1px solid var(--line); margin-top: 26px; padding: 12px 0; }
  .marquee div { display: flex; gap: 36px; width: max-content; font-weight: 800; font-size: 1.25rem; letter-spacing: -.02em; white-space: nowrap; }
  .marquee span:nth-child(even) { color: var(--a); }

  /* Maktab haqida: bento kataklar */
  .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .bento > *, .stickies > * { min-width: 0; }
  .tile { padding: 24px; }
  .t-text { grid-column: span 4; }
  .t-text h2 { margin-bottom: 14px; }
  .t-text p { margin: 0; max-width: 56ch; color: var(--muted); font-size: 1.05rem; }
  .t-cube { grid-column: span 2; grid-row: span 2; display: grid; place-items: center; align-content: center; gap: 22px; background: var(--ink); color: var(--bg); border-color: transparent; overflow: hidden; min-height: 320px; }
  .t-cube .fine { color: inherit; opacity: .7; margin: 0; text-align: center; }
  .stickies { display: contents; margin: 0; }
  .stickies div { grid-column: span 1; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 16px 18px; display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 4px; }
  .stickies dt { font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.25; }
  .stickies dd { margin: 0; font-weight: 800; font-size: 1.55rem; letter-spacing: -.04em; line-height: 1.05; }
  .stickies div:first-child { background: var(--a); border-color: transparent; color: var(--on-a); }
  .stickies div:first-child dt { color: inherit; opacity: .85; }
  .bento .snap { grid-column: span 2; padding: 0; overflow: hidden; }
  .bento .snap .frame { aspect-ratio: 3 / 2; border-radius: 0; }
  .bento .snap figcaption { padding: 10px 16px 12px; font-weight: 600; color: var(--ink); }
  .t-contact { grid-column: span 2; padding: 20px 22px; }
  .t-contact h3 { margin-bottom: 12px; }
  .clist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .clist li { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; }
  .clist .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--a-soft); color: var(--a); display: grid; place-items: center; }
  .clist svg { width: 20px; height: 20px; display: block; }
  .clist small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  .clist a, .clist span.v { font-weight: 700; overflow-wrap: anywhere; }
  .clist span.v.soon { font-weight: 500; font-style: italic; color: var(--muted); }
  .credit { font-size: 13px; color: var(--muted); margin: 14px 0 0; }

  /* Biz haqimizda */
  .us { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
  .us > * { min-width: 0; }
  .us .tile p { margin: 0; color: var(--muted); }
  .us h3 { font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em; }
  .u-who { grid-row: span 2; background: var(--a); color: var(--on-a); border-color: transparent; }
  .us .u-who p { color: inherit; font-size: 1.2rem; line-height: 1.45; }
  .us .tile:last-child { grid-column: span 2; }
  .us .clist { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  @media (max-width: 900px) { .us { grid-template-columns: 1fr; } .us .tile:last-child { grid-column: auto; } }

  /* 3D kub */
  .cubewrap { perspective: 900px; width: 170px; height: 170px; touch-action: none; cursor: grab; }
  .cubewrap:active { cursor: grabbing; }
  .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateX(var(--cx, -22deg)) rotateY(var(--cy, 32deg)); }
  .cube div { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 4px; text-align: center; background: var(--a); color: var(--on-a); border: 2px solid color-mix(in srgb, var(--on-a) 35%, transparent); border-radius: 14px; backface-visibility: hidden; padding: 8px; }
  .cube div:nth-child(even) { background: var(--b); color: var(--on-b); }
  .cube b { font-size: 2rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .cube small { font-size: 12px; font-weight: 600; opacity: .9; }
  .cube div:nth-child(1) { transform: translateZ(85px); }
  .cube div:nth-child(2) { transform: rotateY(90deg) translateZ(85px); }
  .cube div:nth-child(3) { transform: rotateY(180deg) translateZ(85px); }
  .cube div:nth-child(4) { transform: rotateY(-90deg) translateZ(85px); }
  .cube div:nth-child(5) { transform: rotateX(90deg) translateZ(85px); }
  .cube div:nth-child(6) { transform: rotateX(-90deg) translateZ(85px); }

  /* 3D bino */
  .tour { display: grid; grid-template-columns: 1.2fr 1fr; gap: 36px; align-items: center; }
  .tour > * { min-width: 0; }
  .b3scene { perspective: 1300px; padding: 70px 70px 20px 10px; }
  .b3 { position: relative; transform-style: preserve-3d; transform: rotateX(-12deg) rotateY(-24deg); }
  .floors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--card); border: 2px solid var(--ink); border-radius: 4px; padding: 10px; }
  .floors > * { min-width: 0; }
  .b3side, .b3top { pointer-events: none; }
  .b3side { position: absolute; left: 100%; top: 0; width: 90px; height: 100%; transform-origin: left center; transform: rotateY(90deg); background: repeating-linear-gradient(0deg, transparent 0 16px, var(--a) 16px 40px, transparent 40px 56px), var(--a-soft); background-size: 100% 72px; border: 2px solid var(--ink); }
  .b3top { position: absolute; left: 0; bottom: 100%; width: 100%; height: 90px; transform-origin: center bottom; transform: rotateX(90deg); background: var(--ink); border: 2px solid var(--ink); }
  .room { cursor: pointer; text-align: center; font-weight: 600; font-size: 13.5px; line-height: 1.2; min-height: 60px; padding: 8px 5px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--a-soft); width: 100%; overflow-wrap: anywhere; transition: background-color .25s, transform .15s, box-shadow .25s; }
  .room:hover { border-color: var(--a); background: var(--card); }
  .room[aria-pressed="true"] { background: var(--b); color: var(--on-b); border-color: transparent; box-shadow: 0 0 26px var(--b); }
  .door { border-radius: 26px 26px 0 0; background: var(--ink); min-height: 60px; }
  .outside { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .outside .room { min-height: 46px; border-radius: 999px; background: var(--card); }
  .outside .room[aria-pressed="true"] { background: var(--b); }
  .roominfo { padding: 22px 26px 26px; min-height: 170px; overflow: hidden; }
  /* Xonaning 3D ko'rinishi */
  .r3scene { height: 270px; perspective: 900px; display: grid; place-items: center; margin: 0 -26px 14px; cursor: ew-resize; touch-action: pan-y; }
  .dio { width: 0; height: 0; position: relative; transform-style: preserve-3d; transform: translateY(18px) rotateX(-26deg) rotateY(var(--dy, -34deg)); }
  .dio > .fl, .dio > .wl { position: absolute; display: block; }
  .fl { width: 260px; height: 200px; left: -130px; top: -100px; transform: rotateX(90deg); background: var(--a-soft); border: 2px solid var(--line); }
  .fl.gym { background: var(--a-soft); box-shadow: inset 0 0 0 14px var(--a-soft), inset 0 0 0 17px var(--a); }
  .fl.pitch { background: linear-gradient(90deg, transparent calc(50% - 1.500px), #ffffff calc(50% - 1.500px), #ffffff calc(50% + 1.500px), transparent calc(50% + 1.500px)), repeating-linear-gradient(90deg, #1f9a55 0 26px, #23a85d 26px 52px); border: 3px solid #ffffff; }
  .wl { background: var(--card); border: 2px solid var(--line); }
  .wl.back { width: 260px; height: 110px; left: -130px; top: -110px; transform: translateZ(-100px); }
  .wl.side { width: 200px; height: 110px; left: -100px; top: -110px; transform: rotateY(90deg) translateZ(-130px); background: var(--bg); }
  .cb { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform: translate3d(var(--x), var(--y), var(--z)); }
  .cb i { position: absolute; display: block; background: var(--c); }
  .cb i.f, .cb i.k { width: var(--w); height: var(--h); left: calc(var(--w) / -2); top: calc(var(--h) * -1); }
  .cb i.f { transform: translateZ(calc(var(--d) / 2)); }
  .cb i.k { transform: translateZ(calc(var(--d) / -2)); }
  .cb i.r, .cb i.l { width: var(--d); height: var(--h); left: calc(var(--d) / -2); top: calc(var(--h) * -1); background: color-mix(in srgb, var(--c) 72%, #000); }
  .cb i.r { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); }
  .cb i.l { transform: rotateY(90deg) translateZ(calc(var(--w) / -2)); }
  .cb i.t { width: var(--w); height: var(--d); left: calc(var(--w) / -2); top: calc(var(--h) * -1 - var(--d) / 2); transform: rotateX(90deg); background: color-mix(in srgb, var(--c) 82%, #fff); }
  .r3hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
  .roominfo h3 { font-weight: 800; font-size: 1.6rem; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 8px; }
  .roominfo p { margin: 0; color: var(--muted); }

  /* Direktor */
  .director { display: grid; grid-template-columns: 180px 1fr; gap: 30px; align-items: start; padding: 24px; }
  .director > * { min-width: 0; }
  .portrait { aspect-ratio: 4 / 5; overflow: hidden; border-radius: 16px; background: var(--a-soft); color: var(--a); display: grid; place-items: center; font-weight: 800; font-size: 3.4rem; max-width: 100%; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .director .role { color: var(--a); font-weight: 700; font-size: 14px; margin: 0 0 2px; }
  .director .name { font-weight: 800; font-size: 1.5rem; letter-spacing: -.03em; margin: 0 0 10px; }
  .director .bio { margin: 0 0 18px; max-width: 60ch; color: var(--muted); }
  .dfacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 28px; margin: 0; }
  .dfacts dt { font-size: 13px; color: var(--muted); font-weight: 600; }
  .dfacts dd { margin: 0; font-weight: 700; }
  .todo .name, .todo .bio { color: var(--muted); }
  .todo .bio { font-style: italic; }

  /* Sinflar: ixcham jadval */
  .totals { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 14px; }
  .totals div { display: flex; align-items: baseline; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px 6px 14px; }
  .totals dt { color: var(--muted); font-size: 14px; font-weight: 600; }

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function fill(id, items, build) {
  const box = document.getElementById(id);
  box.textContent = "";
  items.forEach(function (item, i) { const n = build(item, i); if (n) box.appendChild(n); });
  return box;
}
function tag() { return document.createTextNode(""); }
function initials(name) {
  return name.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
}
function photoInto(box, src, alt) {
  if (!src) return;
  const img = new Image();
  img.alt = alt;
  img.onload = function () { box.textContent = ""; box.appendChild(img); };
  img.src = src;
}
function pair(dl, label, value, soon) {
  const row = el("div");
  row.appendChild(el("dt", "", label));
  row.appendChild(el("dd", soon ? "soon" : "", value));

}

/* ---------- Hozir maktabda ---------- */
function mins(hhmm) { const p = hhmm.split(":"); return Number(p[0]) * 60 + Number(p[1]); }
function tashkentNow() {
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tashkent", weekday: "short", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(new Date());
  const o = {};
  parts.forEach(function (p) { o[p.type] = p.value; });
  const days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  return { day: days[o.weekday], sec: (Number(o.hour) % 24) * 3600 + Number(o.minute) * 60 + Number(o.second) };
}
function clock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const mm = (h ? String(m).padStart(2, "0") : String(m)), ss = String(s).padStart(2, "0");
  return (h ? h + ":" : "") + mm + ":" + ss;
}
function tickNow() {
  const L = T[LANG];
  const now = tashkentNow();
  const C = 213.6;
  let num = "", what = "", left = null, frac = 0;
  if (SCHOOL_DAYS.indexOf(now.day) === -1) { num = "☼"; what = L.dayoff; left = [L.rest, ""]; }
  else {
    const first = mins(BELLS[0][0]) * 60, last = mins(BELLS[BELLS.length - 1][1]) * 60;
    if (now.sec < first) { num = "1"; what = L.before; left = L.toStart(clock(first - now.sec)); }
    else if (now.sec >= last) { num = "✓"; what = L.after; left = [L.seeYou, ""]; frac = 1; }
    else {
      for (let i = 0; i < BELLS.length; i++) {
        const a = mins(BELLS[i][0]) * 60, b = mins(BELLS[i][1]) * 60;
        if (now.sec >= a && now.sec < b) { num = String(i + 1); what = L.lesson(i + 1); left = L.toBell(clock(b - now.sec)); frac = (now.sec - a) / (b - a); break; }
        const nx = BELLS[i + 1] ? mins(BELLS[i + 1][0]) * 60 : null;
        if (nx !== null && now.sec >= b && now.sec < nx) { num = "♪"; what = L.brk; left = L.toLesson(i + 2, clock(nx - now.sec)); frac = (now.sec - b) / (nx - b); break; }
      }
    }
  }
  document.getElementById("nowNum").textContent = num;
  document.getElementById("nowWhat").textContent = what;
  const lf = document.getElementById("nowLeft");
  lf.textContent = left ? left[0] : "";
  if (left && left[1]) lf.appendChild(el("b", "", left[1]));
  document.getElementById("nowRing").setAttribute("stroke-dashoffset", String(C * (1 - frac)));
  document.getElementById("bellTag").hidden = !BELLS_SAMPLE;
}

function cb(x, y, z, w, h, d, c) {
  const e = el("span", "cb");
  e.style.cssText = "--x:" + x + "px;--y:" + (-y) + "px;--z:" + z + "px;--w:" + w + "px;--h:" + h + "px;--d:" + d + "px;--c:var(--" + c + ")";
  ["f", "k", "r", "l", "t"].forEach(function (n) { e.appendChild(el("i", n)); });
  return e;
}
function desks(list, cols, rows, w, c) {
  rows.forEach(function (z) { cols.forEach(function (x) { list.push(cb(x, 0, z, w, 15, 22, c)); }); });

function setup3D() {
  const wrap = document.getElementById("cubeWrap"), cube = document.getElementById("cube");
  let drag = null, cx = -22, cy = 32;
  wrap.addEventListener("pointerdown", function (e) {
    drag = { x: e.clientX, y: e.clientY, cx: cx, cy: cy };
    cube.classList.remove("spin");
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!drag) return;
    cy = drag.cy + (e.clientX - drag.x) * 0.6;
    cx = Math.max(-80, Math.min(80, drag.cx - (e.clientY - drag.y) * 0.6));
    cube.style.setProperty("--cx", cx.toFixed(1) + "deg");
    cube.style.setProperty("--cy", cy.toFixed(1) + "deg");
  });
  function end() { drag = null; }
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);
}

/* Daftar (kunduzgi) va doska (tungi) rejimi */
(function () {
  const root = document.documentElement;
  const sys = window.matchMedia("(prefers-color-scheme: dark)");
  function current() { return root.dataset.theme || (sys.matches ? "dark" : "light"); }
  function sync() { root.dataset.mode = current(); setThemeLabel(); }
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved === "dark" || saved === "light") root.dataset.theme = saved;
  root.dataset.mode = current();
  document.getElementById("themeBtn").addEventListener("click", function () {
    const next = current() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    sync();
  });
  sys.addEventListener("change", sync);
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
})();

function countUp(scope) {
  if (CALM) return;
  scope.querySelectorAll("[data-count]").forEach(function (node) {
    const to = Number(node.dataset.count);
    const start = performance.now();
    function step(now) {
      const p = Math.min(1, (now - start) / 1100);
      node.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function setupReveal() {
  if (CALM || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.remove("rv-wait");
      countUp(e.target);
      io.unobserve(e.target);
    });
  }, { rootMargin: "0px 0px -10% 0px" });
  document.querySelectorAll(".rv").forEach(function (node) {
    if (node.getBoundingClientRect().top > window.innerHeight * 0.9) { node.classList.add("rv-wait"); io.observe(node); }
  });
}
/* Pastga aylantirilganda rasmlar siljiydi va kattalashadi */
function setupScrollPhotos() {
  if (CALM) return;
  const imgs = Array.prototype.slice.call(document.querySelectorAll("[data-par]"));
  const floats = Array.prototype.slice.call(document.querySelectorAll("[data-float]"));
  floats.forEach(function (f) { f.dataset.rot = getComputedStyle(f).transform; });
  let queued = false;
  function place() {
    queued = false;
    const vh = window.innerHeight;
    imgs.forEach(function (img) {
      const r = img.parentElement.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) return;
      const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / vh));
      img.style.transform = "translate3d(0," + (p * -24).toFixed(1) + "px,0) scale(" + (1.16 - p * 0.08).toFixed(3) + ")";
    });
    floats.forEach(function (fig) {
      const r = fig.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) return;
      const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / vh));
      const base = fig.dataset.rot && fig.dataset.rot !== "none" ? fig.dataset.rot + " " : "";
      fig.style.transform = "translateY(" + (p * 26 * Number(fig.dataset.float)).toFixed(1) + "px) " + base;
    });
  }
  function ask() { if (!queued) { queued = true; requestAnimationFrame(place); } }
  window.addEventListener("scroll", ask, { passive: true });
  window.addEventListener("resize", ask);
  place();
}
function setupTabs() {
  if (!("IntersectionObserver" in window)) return;
  const links = {};
  document.querySelectorAll(".tabs a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      Object.keys(links).forEach(function (k) { links[k].classList.toggle("on", k === e.target.id); });
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  Object.keys(links).forEach(function (k) { const s = document.getElementById(k); if (s) io.observe(s); });
}
