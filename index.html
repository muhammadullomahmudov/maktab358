<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>358-maktab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
  /* Tartib: chapda matn, o'ngda maktab rasmi; pastida kanal to'lqinlari oqadi.
     Ranglar Bektemir kanali suvidan va maktab qo'ng'irog'i sarig'idan olingan. */
  :root {
    --canal: #0d5566;
    --canal-deep: #083b47;
    --water: #d3ecea;
    --water-deep: #a9d6d3;
    --paper: #f6faf9;
    --ink: #12262b;
    --muted: #55707a;
    --sun: #f2b705;
    --line: #cfdedc;
    --card: #ffffff;
    --on-canal: #ffffff;
    --on-sun: #12262b;
    --footer-bg: #083b47;
    --footer-fg: #e4f1ef;
    --display: "Unbounded", "Golos Text", system-ui, sans-serif;
    --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canal: #6cc4d1; --canal-deep: #a9dde3; --water: #143a44; --water-deep: #1c4f5b;
      --paper: #0e1f23; --ink: #e6f1ef; --muted: #8fa9b0; --line: #24424a; --card: #152c32;
      --on-canal: #08262d; --footer-bg: #071619; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canal: #6cc4d1; --canal-deep: #a9dde3; --water: #143a44; --water-deep: #1c4f5b;
    --paper: #0e1f23; --ink: #e6f1ef; --muted: #8fa9b0; --line: #24424a; --card: #152c32;
    --on-canal: #08262d; --footer-bg: #071619; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.6;
  }
  a { color: var(--canal); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  h2 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(1.5rem, 3.2vw, 2rem);
    line-height: 1.2;
    margin: 0 0 28px;
    text-wrap: balance;
  }
  h3 { font-size: 1.05rem; margin: 0 0 12px; }
  .note { color: var(--muted); font-size: 15px; margin: -14px 0 24px; max-width: 60ch; }

  .draft {
    background: var(--sun); color: var(--on-sun);
    font-size: 14px; font-weight: 500; padding: 8px 20px; text-align: center;
  }

  /* Yuqori menyu */
  .top {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  }
  .top .wrap { display: flex; align-items: center; gap: 10px 24px; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--canal); text-decoration: none; margin-right: auto; }
  .top nav { display: flex; gap: 20px; overflow-x: auto; max-width: 100%; white-space: nowrap; scrollbar-width: none; }
  .top nav a {
    color: var(--ink); text-decoration: none; font-weight: 500; font-size: 15px;
    padding: 4px 0; border-bottom: 2px solid transparent; transition: border-color .2s;
  }
  .top nav a:hover { border-bottom-color: var(--sun); }
  .langs { display: flex; border: 1px solid var(--canal); border-radius: 999px; overflow: hidden; }
  .langs button { font: 500 13px var(--body); padding: 6px 12px; border: 0; background: transparent; color: var(--canal); cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--canal); color: var(--on-canal); }
  @media (max-width: 860px) { .top nav { order: 3; width: 100%; } }

  /* Bosh qism */
  .hero { background: var(--water); position: relative; overflow: hidden; }
  .hero .wrap {
    display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 32px 56px;
    padding-top: 56px; padding-bottom: 96px; position: relative; z-index: 1;
  }
  .hero .wrap > * { min-width: 0; }
  .num {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(5rem, 15vw, 11rem); line-height: .82; letter-spacing: -.04em;
    color: var(--canal); margin: 0 0 20px; display: flex;
  }
  .num span { display: inline-block; }
  .hero h1 { font-family: var(--display); font-weight: 500; font-size: clamp(1.35rem, 2.6vw, 1.9rem); line-height: 1.25; margin: 0 0 10px; text-wrap: balance; }
  .place { font-weight: 500; color: var(--canal-deep); margin: 0 0 14px; }
  .lead { margin: 0 0 24px; max-width: 44ch; }
  .cta {
    display: inline-block; background: var(--canal); color: var(--on-canal);
    font-weight: 500; text-decoration: none; padding: 12px 22px; border-radius: 999px;
    transition: transform .2s;
  }
  .cta:hover { transform: translateY(-2px); }

  .photo { position: relative; margin: 0 14px 14px 0; }
  .photo::before {
    content: ""; position: absolute; inset: 14px -14px -14px 14px;
    background: var(--sun); border-radius: 10px 56px 10px 56px;
  }
  .photo .frame {
    position: relative; aspect-ratio: 4 / 3; max-width: 100%;
    border-radius: 10px 56px 10px 56px; overflow: hidden; background: var(--water-deep);
  }
  .photo img, .photo svg { display: block; width: 100%; height: 100%; object-fit: cover; }
  .photo figcaption {
    position: absolute; left: 12px; bottom: 12px;
    background: var(--sun); color: var(--on-sun);
    font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 4px;
  }
  /* chizilgan maktab (rasm qo'yilguncha) */
  .il-sky { fill: var(--water-deep); }
  .il-sun { fill: var(--sun); }
  .il-wall { fill: var(--card); }
  .il-roof, .il-door, .il-pole { fill: var(--canal); }
  .il-ground { fill: var(--canal); opacity: .25; }
  .il-win { fill: var(--water); }
  .il-tree { fill: var(--canal); opacity: .7; }
  .il-flag { fill: var(--sun); transform-origin: 318px 60px; }

  .waves { position: absolute; left: 0; right: 0; bottom: -1px; height: 70px; }
  .waves svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; display: block; }
  .w-back { fill: var(--water-deep); }
  .w-front { fill: var(--paper); }
  .w-line { fill: none; stroke: var(--sun); stroke-width: 3; }

  @media (max-width: 860px) {
    .hero .wrap { grid-template-columns: 1fr; padding-top: 36px; }
  }

  /* Harakat. Hammasi faqat "harakatni kamaytirish" yoqilmagan bo'lsa ishlaydi. */
  @media (prefers-reduced-motion: no-preference) {
    .num span { animation: drop .7s cubic-bezier(.2, 1.3, .4, 1) both; }
    .num span:nth-child(2) { animation-delay: .12s; }
    .num span:nth-child(3) { animation-delay: .24s; }
    .hero h1, .place, .lead, .cta { animation: rise .7s ease-out both; }
    .hero h1 { animation-delay: .35s; }
    .place { animation-delay: .45s; }
    .lead { animation-delay: .55s; }
    .cta { animation-delay: .65s; }
    .photo { animation: unveil 1s cubic-bezier(.2, .8, .2, 1) .2s both; }
    .il-win { animation: light 5s ease-in-out infinite; animation-delay: calc(var(--i) * .13s); }
    .il-flag { animation: flag 2.4s ease-in-out infinite; }
    .waves .s1 { animation: drift 16s linear infinite; }
    .waves .s2 { animation: drift 9s linear infinite; }
    .rv { transition: opacity .7s ease-out, transform .7s ease-out; }
    .rv.rv-wait { opacity: .15; transform: translateY(32px); }
    .chip i { transition: transform .9s cubic-bezier(.2, .8, .2, 1); transition-delay: calc(var(--n) * 40ms); }
    .rv-wait .chip i { transform: scaleX(0); }
    .tcard, .club, .chip { transition: transform .2s; }
    .tcard:hover, .club:hover, .chip:hover { transform: translateY(-3px); }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-60px) rotate(-6deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  @keyframes unveil { from { opacity: 0; transform: translateX(40px) scale(.96); } }
  @keyframes drift { to { transform: translateX(-50%); } }
  @keyframes light { 0%, 70%, 100% { fill: var(--water); } 35% { fill: var(--sun); } }
  @keyframes flag { 50% { transform: skewY(-8deg) scaleX(.92); } }

  /* Bo'limlar */
  section { padding: 64px 0; }
  section + section { border-top: 1px solid var(--line); }

  .about { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; }
  .about > * { min-width: 0; }
  .about p { margin: 0 0 28px; max-width: 60ch; }
  .has { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 28px; }
  .has li { padding: 7px 0 7px 22px; position: relative; break-inside: avoid; }
  .has li::before { content: ""; position: absolute; left: 0; top: 16px; width: 12px; height: 4px; border-radius: 2px; background: var(--sun); }
  .facts { background: var(--canal); color: var(--on-canal); border-radius: 6px 28px 6px 6px; padding: 24px 26px; margin: 0; }
  .facts div { padding: 10px 0; }
  .facts div + div { border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
  .facts dt { font-size: 14px; opacity: .8; }
  .facts dd { margin: 0; font-weight: 500; font-size: 1.05rem; }
  @media (max-width: 760px) { .about { grid-template-columns: 1fr; } .has { columns: 1; } }

  /* Direktor */
  .director { display: grid; grid-template-columns: 220px 1fr; gap: 36px; align-items: start; }
  .director > * { min-width: 0; }
  .portrait {
    aspect-ratio: 4 / 5; border-radius: 6px 40px 6px 6px; overflow: hidden;
    background: var(--water); display: grid; place-items: center; max-width: 100%;
    font-family: var(--display); font-weight: 800; font-size: 3rem; color: var(--canal);
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .director .role { color: var(--canal); font-weight: 500; margin: 0 0 4px; }
  .director .name { font-family: var(--display); font-weight: 500; font-size: 1.4rem; margin: 0 0 14px; }
  .director .bio { margin: 0 0 20px; max-width: 60ch; }
  .dfacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 28px; margin: 0; }
  .dfacts dt { font-size: 14px; color: var(--muted); }
  .dfacts dd { margin: 0; font-weight: 500; }
  @media (max-width: 640px) { .director { grid-template-columns: 1fr; } .portrait { max-width: 200px; } }

  /* Sinflar */
  .sample {
    border: 1.5px dashed var(--sun); border-radius: 6px; padding: 12px 16px; margin: 0 0 28px;
    font-size: 15px; max-width: 70ch;
  }
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 0 0 36px; }
  .totals div { border-left: 4px solid var(--sun); padding-left: 14px; min-width: 0; }
  .totals dt { color: var(--muted); font-size: 15px; }
  .totals dd { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 5vw, 2.6rem); color: var(--canal); font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stage { font-size: 15px; font-weight: 700; color: var(--canal-deep); margin: 28px 0 6px; }
  .grade { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px 20px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .grade > * { min-width: 0; }
  .grade .g { font-family: var(--display); font-weight: 500; font-size: 1.05rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px 9px; min-width: 78px; }
  .chip b { display: block; font-size: 15px; }
  .chip span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip .bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .chip i { display: block; height: 100%; background: var(--canal); border-radius: 2px; transform-origin: left; }
  .grade .sum { font-size: 15px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .grade { grid-template-columns: 1fr auto; }
    .grade .chips { grid-column: 1 / -1; order: 3; }
    .totals { grid-template-columns: 1fr; }
  }

  /* O'qituvchilar va to'garaklar */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; list-style: none; margin: 0; padding: 0; }
  .tcard { background: var(--card); border: 1px solid var(--line); border-radius: 6px 24px 6px 6px; padding: 18px; display: flex; gap: 14px; align-items: center; min-width: 0; }
  .avatar {
    flex: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
    background: var(--water); color: var(--canal); display: grid; place-items: center;
    font-family: var(--display); font-weight: 500; font-size: 16px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tcard div { min-width: 0; }
  .tcard strong { display: block; line-height: 1.3; }
  .tcard .sub { color: var(--canal); font-size: 15px; font-weight: 500; }
  .tcard .exp { color: var(--muted); font-size: 14px; display: block; }
  .club { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--canal); border-radius: 4px; padding: 14px 16px; }
  .club strong { display: block; }
  .club span { color: var(--muted); font-size: 15px; }

  /* To'ldirilishi kerak bo'lgan joylar */
  .todo { border-style: dashed; border-color: var(--muted); background: transparent; }
  .todo strong, .todo .name, .todo .bio { color: var(--muted); }
  .director.todo { border-width: 1.5px; border-radius: 6px; padding: 20px; }
  .news li.todo { border: 0; border-top: 1px solid var(--line); }
  .todo .bio { font-style: italic; }
  .tag { display: inline-block; background: var(--sun); color: var(--on-sun); font: 500 12px var(--body); border-radius: 3px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }

  /* Yangiliklar */
  .news { list-style: none; margin: 0; padding: 0; }
  .news li { display: grid; grid-template-columns: 130px 1fr; gap: 6px 28px; padding: 22px 0; border-top: 1px solid var(--line); }
  .news li > * { min-width: 0; }
  .news li:first-child { border-top: 0; padding-top: 0; }
  .news .when { font-family: var(--display); font-weight: 500; font-size: 14px; color: var(--canal); padding-top: 4px; }
  .news h3 { margin-bottom: 6px; font-size: 1.15rem; }
  .news p { margin: 0; max-width: 64ch; }
  .news .src { font-size: 14px; display: inline-block; margin-top: 6px; }
  .news li.todo h3, .news li.todo p { color: var(--muted); font-style: italic; }
  @media (max-width: 600px) { .news li { grid-template-columns: 1fr; } }

  footer { background: var(--footer-bg); color: var(--footer-fg); padding: 44px 0; }
  footer h2 { margin-bottom: 16px; }
  footer p { margin: 0 0 6px; }
  footer .small { font-size: 14px; opacity: .75; margin-top: 22px; }
</style>
</head>
<body>

<div class="draft" data-t="draft"></div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" data-t="brand"></a>
    <nav aria-label="Bo'limlar">
      <a href="#about" data-t="navAbout"></a>
      <a href="#director" data-t="navDirector"></a>
      <a href="#classes" data-t="navClasses"></a>
      <a href="#teachers" data-t="navTeachers"></a>
      <a href="#clubs" data-t="navClubs"></a>
      <a href="#news" data-t="navNews"></a>
      <a href="#contact" data-t="navContact"></a>
    </nav>
    <div class="langs" role="group" aria-label="Til / Язык / Language">
      <button type="button" data-lang="uz">O‘zb</button>
      <button type="button" data-lang="ru">Рус</button>
      <button type="button" data-lang="en">Eng</button>
    </div>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <div>
        <p class="num" aria-hidden="true"><span>3</span><span>5</span><span>8</span></p>
        <h1 data-t="h1"></h1>
        <p class="place" data-t="place"></p>
        <p class="lead" data-t="lead"></p>
        <a class="cta" href="#classes" data-t="cta"></a>
      </div>
      <figure class="photo">
        <div class="frame" id="heroFrame">
          <!-- Rasm qo'yilguncha ko'rinadigan chizma. rasmlar/maktab.jpg qo'shilsa, o'rnini o'sha rasm egallaydi. -->
          <svg id="heroArt" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Maktab binosi chizmasi">
            <rect class="il-sky" width="400" height="300"/>
            <circle class="il-sun" cx="70" cy="62" r="26"/>
            <rect class="il-ground" y="250" width="400" height="50"/>
            <rect class="il-pole" x="315" y="56" width="3" height="76"/>
            <path class="il-flag" d="M318 60 h34 l-8 9 l8 9 h-34 z"/>
            <rect class="il-roof" x="52" y="124" width="296" height="10" rx="2"/>
            <rect class="il-wall" x="60" y="132" width="280" height="120"/>
            <g id="heroWins"></g>
            <rect class="il-door" x="184" y="212" width="32" height="40" rx="3"/>
            <circle class="il-tree" cx="34" cy="226" r="20"/>
            <rect class="il-tree" x="32" y="240" width="4" height="14"/>
            <circle class="il-tree" cx="368" cy="230" r="17"/>
            <rect class="il-tree" x="366" y="242" width="4" height="12"/>
          </svg>
        </div>
        <figcaption id="heroCap" data-t="photoTodo"></figcaption>
      </figure>
    </div>
    <div class="waves" aria-hidden="true">
      <svg class="s1" viewBox="0 0 2400 70" preserveAspectRatio="none">
        <path class="w-back" d="M0 26 Q150 2 300 26 T600 26 T900 26 T1200 26 T1500 26 T1800 26 T2100 26 T2400 26 V70 H0 Z"/>
      </svg>
      <svg class="s2" viewBox="0 0 2400 70" preserveAspectRatio="none">
        <path class="w-front" d="M0 44 Q150 22 300 44 T600 44 T900 44 T1200 44 T1500 44 T1800 44 T2100 44 T2400 44 V70 H0 Z"/>
        <path class="w-line" d="M0 44 Q150 22 300 44 T600 44 T900 44 T1200 44 T1500 44 T1800 44 T2100 44 T2400 44"/>
      </svg>
    </div>
  </div>

  <section id="about">
    <div class="wrap rv">
      <h2 data-t="aboutTitle"></h2>
      <div class="about">
        <div>
          <p data-t="aboutText"></p>
          <h3 data-t="hasTitle"></h3>
          <ul class="has" id="has"></ul>
        </div>
        <dl class="facts" id="facts"></dl>
      </div>
    </div>
  </section>

  <section id="director">
    <div class="wrap rv">
      <h2 data-t="directorTitle"></h2>
      <div class="director" id="directorBox"></div>
    </div>
  </section>

  <section id="classes">
    <div class="wrap rv" id="classesWrap">
      <h2 data-t="classesTitle"></h2>
      <p class="sample" id="sampleNote" data-t="sampleNote"></p>
      <dl class="totals" id="totals"></dl>
      <div id="grades"></div>
    </div>
  </section>

  <section id="teachers">
    <div class="wrap rv">
      <h2 data-t="teachersTitle"></h2>
      <p class="note" data-t="teachersNote"></p>
      <ul class="cards" id="teacherList"></ul>
    </div>
  </section>

  <section id="clubs">
    <div class="wrap rv">
      <h2 data-t="clubsTitle"></h2>
      <p class="note" data-t="clubsNote"></p>
      <ul class="cards" id="clubList"></ul>
    </div>
  </section>

  <section id="news">
    <div class="wrap rv">
      <h2 data-t="newsTitle"></h2>
      <ul class="news" id="newsList"></ul>
    </div>
  </section>
</main>

<footer id="contact">
  <div class="wrap">
    <h2 data-t="contactTitle"></h2>
    <p data-t="contactAddress"></p>
    <p data-t="contactPhone"></p>
    <p data-t="contactHours"></p>
    <p class="small" data-t="footNote"></p>
  </div>
</footer>

<script>
/* =====================================================================
   1-QISM. SAYT MA'LUMOTLARI
   Ma'lumot qo'shish yoki o'zgartirish uchun faqat shu qismga teging.
   Matnlar uch tilda yoziladi: uz, ru, en.
   "todo: true" — hali to'ldirilmagan joy (saytda sariq belgi chiqadi).
   To'ldirgach, shu qatorni o'chirib tashlang.
   ===================================================================== */

/* Rasmlar. Fayllarni "rasmlar" papkasiga shu nomlar bilan qo'ying. */
const HERO_PHOTO = "rasmlar/maktab.jpg";

const DIRECTOR = {
  todo: true,
  photo: "rasmlar/direktor.jpg",
  name: { uz: "Ism Familiya", ru: "Имя Фамилия", en: "First and last name" },
  bio: { uz: "Direktor haqida qisqa ma’lumot shu yerga yoziladi: ma’lumoti, ish tajribasi va maktabga qachon kelgani.",
         ru: "Здесь будет краткая информация о директоре: образование, опыт работы и когда пришёл в школу.",

const CALM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function fill(id, items, build) {
  const box = document.getElementById(id);
  box.textContent = "";
  items.forEach(function (item, i) { box.appendChild(build(item, i)); });
  return box;
}
function tag(lang) { return el("span", "tag", T[lang].todo); }
function initials(name) {
  return name.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
}
/* Rasm bor bo'lsa ko'rsatadi, bo'lmasa o'rnida bosh harflar qoladi */
function photoInto(box, src, alt) {
  if (!src) return;
  const img = new Image();
  img.alt = alt;
  img.onload = function () { box.textContent = ""; box.appendChild(img); };
  img.src = src;
}

function totals() {
  let students = 0, classes = 0, max = 0;
  CLASSES.forEach(function (c) {
    Object.keys(c.groups).forEach(function (k) {
      students += c.groups[k]; classes += 1; max = Math.max(max, c.groups[k]);
    });
  });
  return { students: students, classes: classes, avg: classes ? Math.round(students / classes) : 0, max: max };
}

function render(lang) {
  const L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function (node) { node.textContent = L[node.dataset.t]; });
  document.querySelectorAll("[data-lang]").forEach(function (btn) {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
  });

  fill("facts", FACTS, function (f) {
    const row = el("div");
    row.appendChild(el("dt", "", f.label[lang]));
    row.appendChild(el("dd", "", f.value[lang]));
    return row;
  });
  fill("has", HAS, function (h) { return el("li", "", h[lang]); });

  /* Direktor */
  const dbox = document.getElementById("directorBox");
  dbox.textContent = "";
  dbox.classList.toggle("todo", !!DIRECTOR.todo);
  const portrait = el("div", "portrait", DIRECTOR.todo ? "?" : initials(DIRECTOR.name[lang]));
  photoInto(portrait, DIRECTOR.photo, DIRECTOR.name[lang]);
  dbox.appendChild(portrait);
  const dtext = el("div");
  dtext.appendChild(el("p", "role", L.directorRole));
  const dname = el("p", "name", DIRECTOR.name[lang]);
  if (DIRECTOR.todo) dname.appendChild(tag(lang));
  dtext.appendChild(dname);
  dtext.appendChild(el("p", "bio", DIRECTOR.bio[lang]));
  const dl = el("dl", "dfacts");
  DIRECTOR.facts.forEach(function (f) {
    const row = el("div");
    row.appendChild(el("dt", "", f.label[lang]));
    row.appendChild(el("dd", "", f.value[lang]));
    dl.appendChild(row);
  });
  dtext.appendChild(dl);
  dbox.appendChild(dtext);

  /* Sinflar */
  const tot = totals();
  document.getElementById("sampleNote").hidden = !CLASSES_SAMPLE;
  fill("totals", [[L.totStudents, tot.students], [L.totClasses, tot.classes], [L.totAvg, tot.avg]], function (pair) {
    const row = el("div");
    row.appendChild(el("dt", "", pair[0]));
    const dd = el("dd", "", String(pair[1]));
    dd.dataset.count = pair[1];
    row.appendChild(dd);
    return row;
  });
  const grades = document.getElementById("grades");
  grades.textContent = "";
  let n = 0;
  STAGES.forEach(function (stage) {
    const rows = CLASSES.filter(function (c) { return c.grade >= stage.from && c.grade <= stage.to; });
    if (!rows.length) return;
    grades.appendChild(el("h3", "stage", stage.name[lang]));
    rows.forEach(function (c) {
      const row = el("div", "grade");
      row.appendChild(el("div", "g", L.gradeName(c.grade)));
      const chips = el("ul", "chips");
      let sum = 0;
      const keys = Object.keys(c.groups);
      keys.forEach(function (k) {
        const count = c.groups[k];
        sum += count;
        const chip = el("li", "chip");
        chip.style.setProperty("--n", n++);
        chip.appendChild(el("b", "", c.grade + "-" + k));
        chip.appendChild(el("span", "", L.pupils(count)));
        const bar = el("span", "bar");
        const inner = el("i");
        inner.style.width = Math.round(count / tot.max * 100) + "%";
        bar.appendChild(inner);
        chip.appendChild(bar);
        chips.appendChild(chip);
      });
      row.appendChild(chips);
      row.appendChild(el("div", "sum", L.gradeSum(keys.length, sum)));
      grades.appendChild(row);
    });
  });

  fill("teacherList", TEACHERS, function (t) {
    const li = el("li", "tcard" + (t.todo ? " todo" : ""));
    const av = el("span", "avatar", t.todo ? "?" : initials(t.name[lang]));
    photoInto(av, t.photo, t.name[lang]);
    li.appendChild(av);
    const body = el("div");
    const name = el("strong", "", t.name[lang]);
    if (t.todo) name.appendChild(tag(lang));
    body.appendChild(name);
    body.appendChild(el("span", "sub", t.subject[lang]));
    if (t.exp) body.appendChild(el("span", "exp", t.exp[lang]));
    li.appendChild(body);
    return li;
  });

  fill("clubList", CLUBS, function (c) {
    const li = el("li", "club" + (c.todo ? " todo" : ""));
    const name = el("strong", "", c.name[lang]);
    if (c.todo) name.appendChild(tag(lang));
    li.appendChild(name);
    li.appendChild(el("span", "", c.info[lang]));
    return li;
  });

  fill("newsList", NEWS, function (item) {
    const li = el("li", item.todo ? "todo" : "");
    li.appendChild(el("div", "when", item.when[lang]));
    const body = el("div");
    const h = el("h3", "", item.title[lang]);
    if (item.todo) h.appendChild(tag(lang));
    body.appendChild(h);
    body.appendChild(el("p", "", item.text[lang]));
    if (item.src) {
      const a = el("a", "src", L.source + ": " + new URL(item.src).hostname);
      a.href = item.src; a.target = "_blank"; a.rel = "noopener";
      body.appendChild(a);
    }
    li.appendChild(body);
    return li;
  });
}

/* Sonlarni noldan sanab chiqish */
function countUp(scope) {
  if (CALM) return;
  scope.querySelectorAll("[data-count]").forEach(function (node) {
    const to = Number(node.dataset.count);
    const start = performance.now();
    function step(now) {
      const p = Math.min(1, (now - start) / 1100);
      node.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* Bo'limlar ekranga kirganda ko'tarilib chiqadi */
function setupReveal() {
  if (CALM || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.remove("rv-wait");
      countUp(e.target);
      io.unobserve(e.target);
    });
  }, { rootMargin: "0px 0px -12% 0px" });
  document.querySelectorAll(".rv").forEach(function (node) {
    if (node.getBoundingClientRect().top > window.innerHeight * 0.85) {
      node.classList.add("rv-wait");
      io.observe(node);
    }
  });
}

let saved = null;
try { saved = localStorage.getItem("lang"); } catch (e) {}
render(T[saved] ? saved : "uz");
setupReveal();

document.querySelectorAll("[data-lang]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    render(btn.dataset.lang);
    try { localStorage.setItem("lang", btn.dataset.lang); } catch (e) {}
  });
});
</script>
</body>
